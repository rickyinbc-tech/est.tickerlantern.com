<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" role="img" aria-labelledby="loss-harvest-outcomes-title loss-harvest-outcomes-desc"><title id="loss-harvest-outcomes-title">What happens to the $25,000 loss under four choices</title><desc id="loss-harvest-outcomes-desc">Horizontal stacked bar chart. CAD; value axis starts at zero. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="52" y1="29" x2="52" y2="268"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="290" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="164.5" y1="29" x2="164.5" y2="268"/><text font-family="sans-serif" font-size="10" fill="#556779" x="164.5" y="290" text-anchor="middle" >$6.3k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="29" x2="277" y2="268"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="290" text-anchor="middle" >$12.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="389.5" y1="29" x2="389.5" y2="268"/><text font-family="sans-serif" font-size="10" fill="#556779" x="389.5" y="290" text-anchor="middle" >$18.8k</text><line stroke="#d7e0e8" stroke-width="1" x1="502" y1="29" x2="502" y2="268"/><text font-family="sans-serif" font-size="10" fill="#556779" x="502" y="290" text-anchor="middle" >$25k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="24" text-anchor="start" >Sell and buy a different fund</text><rect x="52" y="36" width="360" height="18" fill="#087f76"/><rect x="412" y="36" width="90" height="18" fill="#102f50"/><rect x="502" y="36" width="0" height="18" fill="#b8822e"/><rect x="502" y="36" width="0" height="18" fill="#6758a6"/><rect x="502" y="36" width="0" height="18" fill="#bf5c4b"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="69" text-anchor="start" class="plot-value">$25,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="86" text-anchor="start" >Sell and rebuy the same fund within 30 days</text><rect x="52" y="98" width="0" height="18" fill="#087f76"/><rect x="52" y="98" width="0" height="18" fill="#102f50"/><rect x="52" y="98" width="450" height="18" fill="#b8822e"/><rect x="502" y="98" width="0" height="18" fill="#6758a6"/><rect x="502" y="98" width="0" height="18" fill="#bf5c4b"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="131" text-anchor="start" class="plot-value">$25,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="148" text-anchor="start" >Sell, then buy the same fund in your TFSA or RRSP within 30 days</text><rect x="52" y="160" width="0" height="18" fill="#087f76"/><rect x="52" y="160" width="0" height="18" fill="#102f50"/><rect x="52" y="160" width="0" height="18" fill="#b8822e"/><rect x="52" y="160" width="450" height="18" fill="#6758a6"/><rect x="502" y="160" width="0" height="18" fill="#bf5c4b"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="193" text-anchor="start" class="plot-value">$25,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="210" text-anchor="start" >Keep holding the fund</text><rect x="52" y="222" width="0" height="18" fill="#087f76"/><rect x="52" y="222" width="0" height="18" fill="#102f50"/><rect x="52" y="222" width="0" height="18" fill="#b8822e"/><rect x="52" y="222" width="0" height="18" fill="#6758a6"/><rect x="52" y="222" width="450" height="18" fill="#bf5c4b"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="255" text-anchor="start" class="plot-value">$25,000</text><line stroke="#91aabd" stroke-width="1" x1="52" y1="29" x2="52" y2="268"/><line stroke="#91aabd" stroke-width="1" x1="52" y1="268" x2="502" y2="268"/></svg>