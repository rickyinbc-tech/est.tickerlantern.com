<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 592" width="520" height="592" role="img" aria-labelledby="rent-quote-budget-title rent-quote-budget-desc"><title id="rent-quote-budget-title">Test the actual quote against the whole monthly plan</title><desc id="rent-quote-budget-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="582" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="173" y1="14" x2="173" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="173" y="582" text-anchor="middle" >$2.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="282" y1="14" x2="282" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="282" y="582" text-anchor="middle" >$5k</text><line stroke="#d7e0e8" stroke-width="1" x1="391" y1="14" x2="391" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="391" y="582" text-anchor="middle" >$7.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="500" y1="14" x2="500" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="500" y="582" text-anchor="middle" >$10k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Household take-home income</text><rect x="64" y="37" width="239.8" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$5,500</text><line x1="303.8" x2="303.8" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Actual rent quote being assessed</text><rect x="199.16" y="104" width="104.64000000000001" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">-$2,400</text><line x1="199.16" x2="199.16" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Utilities outside the rent</text><rect x="192.62" y="171" width="6.539999999999992" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">-$150</text><line x1="192.62" x2="192.62" y1="189" y2="238" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Tenant insurance</text><rect x="190.87599999999998" y="238" width="1.7440000000000282" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">-$40</text><line x1="190.87599999999998" x2="190.87599999999998" y1="256" y2="305" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="294" text-anchor="start" >Transport for this location</text><rect x="182.156" y="305" width="8.71999999999997" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="339" text-anchor="start" class="plot-value">-$200</text><line x1="182.156" x2="182.156" y1="323" y2="372" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="361" text-anchor="start" >Other living expenses</text><rect x="94.95599999999999" y="372" width="87.20000000000002" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="406" text-anchor="start" class="plot-value">-$2,000</text><line x1="94.95599999999999" x2="94.95599999999999" y1="390" y2="439" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="428" text-anchor="start" >Saving allocation</text><rect x="73.156" y="439" width="21.799999999999983" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="473" text-anchor="start" class="plot-value">-$500</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="495" text-anchor="start" >Unassigned monthly cash</text><rect x="64" y="506" width="9.156000000000006" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="540" text-anchor="start" class="plot-value">$210</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="558" x2="500" y2="558"/></svg>