<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 168" width="520" height="168" role="img" aria-labelledby="joint-income-probability-grid-title joint-income-probability-grid-desc"><title id="joint-income-probability-grid-title">The four cells preserve each income’s individual absence probability</title><desc id="joint-income-probability-grid-desc">Scenario matrix. Darker cells mean larger values. Scale: 0.0% to 85.5%. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="210" y="22" text-anchor="middle" >B retained</text><text font-family="sans-serif" font-size="10" fill="#556779" x="410" y="22" text-anchor="middle" >B absent</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >A retained</text><rect x="111" y="44" width="198" height="54" fill="rgb(91,170,164)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="210" y="76" text-anchor="middle" class="plot-cell-label">85.5%</text><rect x="311" y="44" width="198" height="54" fill="rgb(238,245,244)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="410" y="76" text-anchor="middle" class="plot-cell-label">4.5%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >A absent</text><rect x="111" y="100" width="198" height="54" fill="rgb(238,245,244)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="210" y="132" text-anchor="middle" class="plot-cell-label">4.5%</text><rect x="311" y="100" width="198" height="54" fill="rgb(236,244,243)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="410" y="132" text-anchor="middle" class="plot-cell-label">5.5%</text></svg>