<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="hbp-tax-budget-matrix-title hbp-tax-budget-matrix-desc"><title id="hbp-tax-budget-matrix-title">Assumed tax allowances across regular and first-year repayments</title><desc id="hbp-tax-budget-matrix-desc">Scenario matrix. Darker cells mean larger values. Scale: $0 to $9k. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="22" text-anchor="middle" >$0 extra</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="22" text-anchor="middle" >$3k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="22" text-anchor="middle" >$6k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="22" text-anchor="middle" >$10k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >$0k / yr</text><rect x="111" y="44" width="98" height="54" fill="rgb(91,170,164)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="76" text-anchor="middle" class="plot-cell-label">$9k</text><rect x="211" y="44" width="98" height="54" fill="rgb(107,178,172)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="76" text-anchor="middle" class="plot-cell-label">$8.1k</text><rect x="311" y="44" width="98" height="54" fill="rgb(122,186,180)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="76" text-anchor="middle" class="plot-cell-label">$7.2k</text><rect x="411" y="44" width="98" height="54" fill="rgb(143,196,192)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="76" text-anchor="middle" class="plot-cell-label">$6k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >$1k / yr</text><rect x="111" y="100" width="98" height="54" fill="rgb(169,209,206)"/><text font-famil