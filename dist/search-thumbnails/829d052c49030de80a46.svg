<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="equal-pay-endpoint-matrix-title equal-pay-endpoint-matrix-desc"><title id="equal-pay-endpoint-matrix-title">Year-end differences across installments and total-charge scenarios</title><desc id="equal-pay-endpoint-matrix-desc">Scenario matrix. Negative values use gold; positive values use teal. Read the signed cell labels. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="176.66666666666669" y="22" text-anchor="middle" >Charges −10%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="310" y="22" text-anchor="middle" >Charges unchanged</text><text font-family="sans-serif" font-size="10" fill="#556779" x="443.33333333333337" y="22" text-anchor="middle" >Charges +10%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >$125 installment</text><rect x="111" y="44" width="131.33333333333334" height="54" fill="rgb(180,215,212)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="176.66666666666669" y="76" text-anchor="middle" class="plot-cell-label">$300</text><rect x="244.33333333333334" y="44" width="131.33333333333334" height="54" fill="rgb(136,192,188)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="310" y="76" text-anchor="middle" class="plot-cell-label">$500</text><rect x="377.6666666666667" y="44" width="131.33333333333334" height="54" fill="rgb(91,170,164)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="443.33333333333337" y="76" text-anchor="middle" class="plot-cell-label">$700</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >$150 installment</text><rect x="111" y="100" width="131.33333333333334" height="54" fill="rgb(246,249,248)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="176.666666666666