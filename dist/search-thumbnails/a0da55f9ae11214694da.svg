<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 257" width="520" height="257" role="img" aria-labelledby="payment-perception-full-minimum-title payment-perception-full-minimum-desc"><title id="payment-perception-full-minimum-title">Fund the full quoted minimum rather than multiplying it by a survey percentage</title><desc id="payment-perception-full-minimum-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="247" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="173" y1="14" x2="173" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="173" y="247" text-anchor="middle" >$500</text><line stroke="#d7e0e8" stroke-width="1" x1="282" y1="14" x2="282" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="282" y="247" text-anchor="middle" >$1k</text><line stroke="#d7e0e8" stroke-width="1" x1="391" y1="14" x2="391" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="391" y="247" text-anchor="middle" >$1.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="500" y1="14" x2="500" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="500" y="247" text-anchor="middle" >$2k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Full quoted next minimum payment</text><rect x="64" y="37" width="327" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$1,500</text><line x1="391" x2="391" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Usable resources applied, capped at that payment</text><rect x="260.20000000000005" y="104" width="130.79999999999995" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">-$600</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Unfunded portion of this minimum</text><rect x="64" y="171" width="196.20000000000005" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">$900</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="223" x2="500" y2="223"/></svg>