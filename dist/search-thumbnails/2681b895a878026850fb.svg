<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 168" width="520" height="168" role="img" aria-labelledby="income-transition-count-matrix-title income-transition-count-matrix-desc"><title id="income-transition-count-matrix-title">Four person-count cells retain both the starting and ending status</title><desc id="income-transition-count-matrix-desc">Scenario matrix. Darker cells mean larger values. Scale: 0 to 22.9m. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="210" y="22" text-anchor="middle" >Low later</text><text font-family="sans-serif" font-size="10" fill="#556779" x="410" y="22" text-anchor="middle" >Not low later</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >Low first</text><rect x="111" y="44" width="198" height="54" fill="rgb(226,239,237)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="210" y="76" text-anchor="middle" class="plot-cell-label">2.9m</text><rect x="311" y="44" width="198" height="54" fill="rgb(236,244,242)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="410" y="76" text-anchor="middle" class="plot-cell-label">1.5m</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >Not low</text><rect x="111" y="100" width="198" height="54" fill="rgb(239,246,244)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="210" y="132" text-anchor="middle" class="plot-cell-label">980.9k</text><rect x="311" y="100" width="198" height="54" fill="rgb(91,170,164)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="410" y="132" text-anchor="middle" class="plot-cell-label">22.9m</text></svg>