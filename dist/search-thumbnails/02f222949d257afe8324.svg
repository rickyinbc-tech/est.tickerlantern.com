<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="warranty-cost-matrix-title warranty-cost-matrix-desc"><title id="warranty-cost-matrix-title">Expected cost differences depend on repair severity as well as its chance</title><desc id="warranty-cost-matrix-desc">Scenario matrix. Negative values use gold; positive values use teal. Read the signed cell labels. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="22" text-anchor="middle" >$300</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="22" text-anchor="middle" >$600</text><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="22" text-anchor="middle" >$900</text><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="22" text-anchor="middle" >$1,200</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >10% chance</text><rect x="111" y="44" width="98" height="54" fill="rgb(208,229,227)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="76" text-anchor="middle" class="plot-cell-label">$160</text><rect x="211" y="44" width="98" height="54" fill="rgb(215,233,231)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="76" text-anchor="middle" class="plot-cell-label">$130</text><rect x="311" y="44" width="98" height="54" fill="rgb(222,237,235)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="76" text-anchor="middle" class="plot-cell-label">$100</text><rect x="411" y="44" width="98" height="54" fill="rgb(229,240,239)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="76" text-anchor="middle" class="plot-cell-label">$70</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >25% chance</text><rect x="111" y="100" width="98" height="54" f