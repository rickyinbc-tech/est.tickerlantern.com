<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="rrsp-payroll-grid-title rrsp-payroll-grid-desc"><title id="rrsp-payroll-grid-title">Reduced at source minus spring refund invested after 25 years</title><desc id="rrsp-payroll-grid-desc">Scenario matrix. Darker cells mean larger values. Scale: $0 to $75.3k. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="22" text-anchor="middle" >0% fund return</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="22" text-anchor="middle" >3% fund return</text><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="22" text-anchor="middle" >6% fund return</text><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="22" text-anchor="middle" >9% fund return</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >20%</text><rect x="111" y="44" width="98" height="54" fill="rgb(246,249,248)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="76" text-anchor="middle" class="plot-cell-label">$0</text><rect x="211" y="44" width="98" height="54" fill="rgb(242,247,246)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="76" text-anchor="middle" class="plot-cell-label">$1.8k</text><rect x="311" y="44" width="98" height="54" fill="rgb(235,243,242)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="76" text-anchor="middle" class="plot-cell-label">$5.3k</text><rect x="411" y="44" width="98" height="54" fill="rgb(221,236,234)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="76" text-anchor="middle" class="plot-cell-label">$12.1k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >30%</text><rect x="111" y="100" width="98" height="54" fill="rgb(246,249,248)"/>