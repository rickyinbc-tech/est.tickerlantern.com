<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 458" width="520" height="458" role="img" aria-labelledby="resp-budget-title resp-budget-desc"><title id="resp-budget-title">Connect education funding to the net budget</title><desc id="resp-budget-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="448" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="170.5" y1="14" x2="170.5" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="170.5" y="448" text-anchor="middle" >$6.3k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="14" x2="277" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="448" text-anchor="middle" >$12.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="383.5" y1="14" x2="383.5" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="383.5" y="448" text-anchor="middle" >$18.8k</text><line stroke="#d7e0e8" stroke-width="1" x1="490" y1="14" x2="490" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="490" y="448" text-anchor="middle" >$25k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Confirmed outside funding</text><rect x="64" y="37" width="68.16" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$4,000</text><line x1="132.16" x2="132.16" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Gross modeled EAP</text><rect x="132.16" y="104" width="170.40000000000006" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">+$10,000</text><line x1="302.56000000000006" x2="302.56000000000006" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Contribution withdrawal</text><rect x="302.56000000000006" y="171" width="187.43999999999994" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">+$11,000</text><line x1="490" x2="490" y1="189" y2="238" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Assumed EAP tax allowance</text><rect x="472.96" y="238" width="17.04000000000002" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">-$1,000</text><line x1="472.96" x2="472.96" y1="256" y2="305" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="294" text-anchor="start" >Education budget</text><rect x="64" y="305" width="408.96" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="339" text-anchor="start" class="plot-value">-$24,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="361" text-anchor="start" >Cash left / extra funding needed</text><rect x="64" y="372" width="0" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="406" text-anchor="start" class="plot-value">$0</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="424" x2="490" y2="424"/></svg>