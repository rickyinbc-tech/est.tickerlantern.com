<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 334" width="520" height="334" role="img" aria-labelledby="fhsa-checkpoint-margins-title fhsa-checkpoint-margins-desc"><title id="fhsa-checkpoint-margins-title">Days of margin at each dated checkpoint</title><desc id="fhsa-checkpoint-margins-desc">Horizontal signed bars around an explicit zero axis. Negative values extend left of zero, and positive values extend right. Signs and exact values are included in labels and the data table. Exact values are available in the chart data table below.</desc><line stroke="#91aabd" stroke-width="1" x1="64" y1="30" x2="64" y2="302"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="324" text-anchor="middle" >0</text><line stroke="#d7e0e8" stroke-width="1" x1="170.5" y1="30" x2="170.5" y2="302"/><text font-family="sans-serif" font-size="10" fill="#556779" x="170.5" y="324" text-anchor="middle" >250</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="30" x2="277" y2="302"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="324" text-anchor="middle" >500</text><line stroke="#d7e0e8" stroke-width="1" x1="383.5" y1="30" x2="383.5" y2="302"/><text font-family="sans-serif" font-size="10" fill="#556779" x="383.5" y="324" text-anchor="middle" >750</text><line stroke="#d7e0e8" stroke-width="1" x1="490" y1="30" x2="490" y2="302"/><text font-family="sans-serif" font-size="10" fill="#556779" x="490" y="324" text-anchor="middle" >1,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="24" text-anchor="start" >Acquisition not more than 30 days before withdrawal</text><rect x="64" y="36" width="31.950000000000003" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="69" text-anchor="start" class="plot-value">75</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="94" text-anchor="start" >Acquisition before 1 October of the following year</text><rect x="64" y="106" width="221.51999999999998" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="139" text-anchor="start" class="plot-value">520</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="164" text-anchor="start" >Occupancy within one year of acquisition</text><rect x="64" y="176" width="143.136" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="209" text-anchor="start" class="plot-value">336</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="234" text-anchor="start" >Withdrawal to end of maximum participation period</text><rect x="64" y="246" width="279.882" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="279" text-anchor="start" class="plot-value">657</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="302" x2="490" y2="302"/></svg>