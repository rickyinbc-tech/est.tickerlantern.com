xt font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Repurchased shares removed</text><rect x="473.84" y="104" width="26.160000000000025" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">-6.0</text><line x1="473.84" x2="473.84" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >New fully issued shares</text><rect x="473.84" y="171" width="8.720000000000027" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">+2.0</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Ending modeled shares outstanding</text><rect x="64" y="238" width="418.56" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">96.0</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="290" x2="500" y2="290"/></svg>