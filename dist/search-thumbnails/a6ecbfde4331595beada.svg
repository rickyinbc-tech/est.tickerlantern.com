ill="#556779" x="64" y="93" text-anchor="start" >Additional compulsory fees</text><rect x="200.67784" y="104" width="17.039999999999992" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">+$1,000</text><line x1="217.71784" x2="217.71784" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Living and local transport</text><rect x="217.71784" y="171" width="190.84799999999998" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">+$11,200</text><line x1="408.56584" x2="408.56584" y1="189" y2="238" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Books and equipment</text><rect x="408.56584" y="238" width="17.04000000000002" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">+$1,000</text><line x1="425.60584" x2="425.60584" y1="256" y2="305" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="294" text-anchor="start" >Travel and setup</text><rect x="425.60584" y="305" width="17.039999999999964" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="339" text-anchor="start" class="plot-value">+$1,000</text><line x1="442.64583999999996" x2="442.64583999999996" y1="323" y2="372" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="361" text-anchor="start" >Confirmed funding</text><rect x="238.16584" y="372" width="204.47999999999996" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="406" text-anchor="start"