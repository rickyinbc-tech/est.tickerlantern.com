<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 525" width="520" height="525" role="img" aria-labelledby="metc-claim-waterfall-title metc-claim-waterfall-desc"><title id="metc-claim-waterfall-title">From receipts to federal value for the best claimant (Person B)</title><desc id="metc-claim-waterfall-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="515" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="170.5" y1="14" x2="170.5" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="170.5" y="515" text-anchor="middle" >$2.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="14" x2="277" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="515" text-anchor="middle" >$5k</text><line stroke="#d7e0e8" stroke-width="1" x1="383.5" y1="14" x2="383.5" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="383.5" y="515" text-anchor="middle" >$7.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="490" y1="14" x2="490" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="490" y="515" text-anchor="middle" >$10k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Family expenses in the window</text><rect x="64" y="37" width="191.70000000000002" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$4,500</text><line x1="255.70000000000002" x2="255.70000000000002" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Less 3% / CAD 2,890 threshold</text><rect x="222.472" y="104" width="33.22800000000001" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">-$780</text><line x1="222.472" x2="222.472" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Plus dependant expenses after their threshold</text><rect x="222.472" y="171" width="65.17799999999997" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">+$1,530</text><line x1="287.65" x2="287.65" y1="189" y2="238" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Less the 86% that is not credited</text><rect x="95.311" y="238" width="192.33899999999997" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">-$4,515</text><line x1="95.311" x2="95.311" y1="256" y2="305" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="294" text-anchor="start" >Less credit with no tax to absorb it</text><rect x="95.311" y="305" width="0" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="339" text-anchor="start" class="plot-value">$0</text><line x1="95.311" x2="95.311" y1="323" y2="372" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="361" text-anchor="start" >Plus refundable supplement</text><rect x="95.311" y="372" width="0" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="406" text-anchor="start" class="plot-value">$0</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="428" text-anchor="start" >Federal value of the claim</text><rect x="64" y="439" width="31.311000000000007" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="473" text-anchor="start" class="plot-value">$735</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="491" x2="490" y2="491"/></svg>