<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="joint-loan-reserve-matrix-title joint-loan-reserve-matrix-desc"><title id="joint-loan-reserve-matrix-title">Extra opening cash beyond your selected allocation</title><desc id="joint-loan-reserve-matrix-desc">Scenario matrix. Darker cells mean larger values. Scale: $0 to $25.1k. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="22" text-anchor="middle" >$0 surplus</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="22" text-anchor="middle" >$100</text><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="22" text-anchor="middle" >$300</text><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="22" text-anchor="middle" >$500</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >Start month 1</text><rect x="111" y="44" width="98" height="54" fill="rgb(91,170,164)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="76" text-anchor="middle" class="plot-cell-label">$25.1k</text><rect x="211" y="44" width="98" height="54" fill="rgb(121,185,180)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="76" text-anchor="middle" class="plot-cell-label">$20.3k</text><rect x="311" y="44" width="98" height="54" fill="rgb(180,215,212)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="76" text-anchor="middle" class="plot-cell-label">$10.7k</text><rect x="411" y="44" width="98" height="54" fill="rgb(239,245,244)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="76" text-anchor="middle" class="plot-cell-label">$1.1k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >Start month 13</text><rect x="111" y="100" width="98" height="54" fill="rgb(135,192,187)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="132" text-anchor="middle" class="plot-cell-label">$18.1k</text><rect x="211" y="100" width="98" height="54" fill="rgb(157,203,199)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="132" text-anchor="middle" class="plot-cell-label">$14.5k</text><rect x="311" y="100" width="98" height="54" fill="rgb(201,226,223)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="132" text-anchor="middle" class="plot-cell-label">$7.3k</text><rect x="411" y="100" width="98" height="54" fill="rgb(245,249,248)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="132" text-anchor="middle" class="plot-cell-label">$92.8</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="188" text-anchor="end" >Start month 25</text><rect x="111" y="156" width="98" height="54" fill="rgb(178,214,211)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="188" text-anchor="middle" class="plot-cell-label">$11.1k</text><rect x="211" y="156" width="98" height="54" fill="rgb(193,222,219)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="188" text-anchor="middle" class="plot-cell-label">$8.7k</text><rect x="311" y="156" width="98" height="54" fill="rgb(222,237,235)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="188" text-anchor="middle" class="plot-cell-label">$3.9k</text><rect x="411" y="156" width="98" height="54" fill="rgb(246,249,248)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="188" text-anchor="middle" class="plot-cell-label">$0</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="244" text-anchor="end" >Start month 37</text><rect x="111" y="212" width="98" height="54" fill="rgb(221,236,234)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="244" text-anchor="middle" class="plot-cell-label">