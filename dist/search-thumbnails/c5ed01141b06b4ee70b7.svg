<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" width="520" height="270" role="img" aria-labelledby="arrears-fictional-borrower-share-title arrears-fictional-borrower-share-desc"><title id="arrears-fictional-borrower-share-title">Count each borrower once when any assigned account meets 60+</title><desc id="arrears-fictional-borrower-share-desc">Four fictional borrowers. A borrower is counted once if any of its two assigned account codes is 1 or 2. This is a fixed teaching grouping, not actual credit-report deduplication. Exact values are available in the chart data table below.</desc><circle cx="260" cy="130" r="86" fill="none" stroke="#e3ebed" stroke-width="34"/><circle cx="260" cy="130" r="86" fill="none" stroke="#087f76" stroke-width="34" pathLength="100" stroke-dasharray="50 50" stroke-dashoffset="0" transform="rotate(-90 260 130)"/><circle cx="260" cy="130" r="86" fill="none" stroke="#102f50" stroke-width="34" pathLength="100" stroke-dasharray="50 50" stroke-dashoffset="-50" transform="rotate(-90 260 130)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="123" text-anchor="middle" class="plot-donut-total">4</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="150" text-anchor="middle" >Fictional borrowers</text></svg>