<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="replacement-ratio-budget-sensitivity-title replacement-ratio-budget-sensitivity-desc"><title id="replacement-ratio-budget-sensitivity-title">The gross replacement ratio changes with spending and the tax assumption</title><desc id="replacement-ratio-budget-sensitivity-desc">Scenario matrix. Darker cells mean larger values. Scale: 0.0% to 92.9%. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="22" text-anchor="middle" >0% tax</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="22" text-anchor="middle" >10% tax</text><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="22" text-anchor="middle" >20% tax</text><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="22" text-anchor="middle" >30% tax</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >No extra</text><rect x="111" y="44" width="98" height="54" fill="rgb(171,211,207)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="76" text-anchor="middle" class="plot-cell-label">45.0%</text><rect x="211" y="44" width="98" height="54" fill="rgb(163,206,203)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="76" text-anchor="middle" class="plot-cell-label">50.0%</text><rect x="311" y="44" width="98" height="54" fill="rgb(152,201,197)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="76" text-anchor="middle" class="plot-cell-label">56.3%</text><rect x="411" y="44" width="98" height="54" fill="rgb(139,194,190)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="76" text-anchor="middle" class="plot-cell-label">64.3%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >Extra $5k</tex