<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 257" width="520" height="257" role="img" aria-labelledby="fhsa-bridge-title fhsa-bridge-desc"><title id="fhsa-bridge-title">Account value can differ from the contribution total</title><desc id="fhsa-bridge-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="247" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="173" y1="14" x2="173" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="173" y="247" text-anchor="middle" >$12.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="282" y1="14" x2="282" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="282" y="247" text-anchor="middle" >$25k</text><line stroke="#d7e0e8" stroke-width="1" x1="391" y1="14" x2="391" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="391" y="247" text-anchor="middle" >$37.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="500" y1="14" x2="500" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="500" y="247" text-anchor="middle" >$50k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Cumulative contributions</text><rect x="64" y="37" width="348.8" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$40,000</text><line x1="412.8" x2="412.8" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Modeled investment growth / loss</text><rect x="412.8" y="104" width="51.707460321279996" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">+$5,929.75</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Ending account value</text><rect x="64" y="171" width="400.50746032128" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">$45,929.75</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="223" x2="500" y2="223"/></svg>