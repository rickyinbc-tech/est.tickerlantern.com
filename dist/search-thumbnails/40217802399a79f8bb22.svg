<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" width="520" height="270" role="img" aria-labelledby="payment-shares-fictional-count-title payment-shares-fictional-count-desc"><title id="payment-shares-fictional-count-title">First give each invented purchase one count</title><desc id="payment-shares-fictional-count-desc">Donut of fictional purchase counts by method. Each purchase contributes one count. A zero total count produces an empty ring; count shares are undefined. Exact values are available in the chart data table below.</desc><circle cx="260" cy="130" r="86" fill="none" stroke="#e3ebed" stroke-width="34"/><circle cx="260" cy="130" r="86" fill="none" stroke="#087f76" stroke-width="34" pathLength="100" stroke-dasharray="60 40" stroke-dashoffset="0" transform="rotate(-90 260 130)"/><circle cx="260" cy="130" r="86" fill="none" stroke="#102f50" stroke-width="34" pathLength="100" stroke-dasharray="30 70" stroke-dashoffset="-60" transform="rotate(-90 260 130)"/><circle cx="260" cy="130" r="86" fill="none" stroke="#b8822e" stroke-width="34" pathLength="100" stroke-dasharray="10 90" stroke-dashoffset="-90" transform="rotate(-90 260 130)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="123" text-anchor="middle" class="plot-donut-total">10</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="150" text-anchor="middle" >Purchases counted</text></svg>