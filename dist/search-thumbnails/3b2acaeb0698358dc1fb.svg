<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 391" width="520" height="391" role="img" aria-labelledby="gift-reconcile-title gift-reconcile-desc"><title id="gift-reconcile-title">Reconcile the selected portfolio’s final balance</title><desc id="gift-reconcile-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="381" text-anchor="middle" >-$200k</text><line stroke="#d7e0e8" stroke-width="1" x1="173" y1="14" x2="173" y2="357"/><line stroke="#d7e0e8" stroke-width="1" x1="282" y1="14" x2="282" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="282" y="381" text-anchor="middle" >$150k</text><line stroke="#d7e0e8" stroke-width="1" x1="391" y1="14" x2="391" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="391" y="381" text-anchor="middle" >$325k</text><line stroke="#d7e0e8" stroke-width="1" x1="500" y1="14" x2="500" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="500" y="381" text-anchor="middle" >$500k</text><line stroke="#d7e0e8" stroke-width="1" x1="188.57142857142856" y1="14" x2="188.57142857142856" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="188.57142857142856" y="381" text-anchor="middle" >$0</text><line stroke="#91aabd" stroke-width="1" x1="188.57142857142856" y1="14" x2="188.57142857142856" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Starting portfolio</text><rect x="188.57142857142856" y="37" width="311.42857142857144" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">