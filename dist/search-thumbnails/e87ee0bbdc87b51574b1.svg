<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="repeated-risk-horizon-matrix-title repeated-risk-horizon-matrix-desc"><title id="repeated-risk-horizon-matrix-title">Change the annual chance and the horizon without treating either as observed data</title><desc id="repeated-risk-horizon-matrix-desc">Scenario matrix. Darker cells mean larger values. Scale: 0.0% to 98.8%. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="22" text-anchor="middle" >1 year</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="22" text-anchor="middle" >5 years</text><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="22" text-anchor="middle" >10 years</text><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="22" text-anchor="middle" >20 years</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >1% / yr</text><rect x="111" y="44" width="98" height="54" fill="rgb(244,248,247)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="76" text-anchor="middle" class="plot-cell-label">1.0%</text><rect x="211" y="44" width="98" height="54" fill="rgb(238,245,244)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="76" text-anchor="middle" class="plot-cell-label">4.9%</text><rect x="311" y="44" width="98" height="54" fill="rgb(231,241,240)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="76" text-anchor="middle" class="plot-cell-label">9.6%</text><rect x="411" y="44" width="98" height="54" fill="rgb(218,234,232)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="76" text-anchor="middle" class="plot-cell-label">18.2%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >5% / yr</text><rect x="111" y="100" width="98" height="54" fill="rgb(238,245,244)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="132" text-anchor="middle" class="plot-cell-label">5.0%</text><rect x="211" y="100" width="98" height="54" fill="rgb(211,231,229)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="132" text-anchor="middle" class="plot-cell-label">22.6%</text><rect x="311" y="100" width="98" height="54" fill="rgb(183,217,214)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="132" text-anchor="middle" class="plot-cell-label">40.1%</text><rect x="411" y="100" width="98" height="54" fill="rgb(146,198,193)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="132" text-anchor="middle" class="plot-cell-label">64.2%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="188" text-anchor="end" >10% / yr</text><rect x="111" y="156" width="98" height="54" fill="rgb(230,241,239)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="188" text-anchor="middle" class="plot-cell-label">10.0%</text><rect x="211" y="156" width="98" height="54" fill="rgb(182,216,213)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="188" text-anchor="middle" class="plot-cell-label">41.0%</text><rect x="311" y="156" width="98" height="54" fill="rgb(144,197,192)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="188" text-anchor="middle" class="plot-cell-label">65.1%</text><rect x="411" y="156" width="98" height="54" fill="rgb(109,179,173)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="188" text-anchor="middle" class="plot-cell-label">87.8%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="244" text-anchor="end" >20% / yr</text><rect x="111" y="212" width="98" height="54" fill="rgb(215,233,231)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="244" text-anchor="middle" clas