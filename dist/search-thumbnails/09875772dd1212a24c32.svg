<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" role="img" aria-labelledby="wealth-older-title wealth-older-desc"><title id="wealth-older-title">Ages 55–64: housing and pension status change the comparison</title><desc id="wealth-older-desc">Horizontal bar chart. CAD; value axis starts at zero. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="52" y1="29" x2="52" y2="268"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="290" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="164.5" y1="29" x2="164.5" y2="268"/><text font-family="sans-serif" font-size="10" fill="#556779" x="164.5" y="290" text-anchor="middle" >$500k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="29" x2="277" y2="268"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="290" text-anchor="middle" >$1.0m</text><line stroke="#d7e0e8" stroke-width="1" x1="389.5" y1="29" x2="389.5" y2="268"/><text font-family="sans-serif" font-size="10" fill="#556779" x="389.5" y="290" text-anchor="middle" >$1.5m</text><line stroke="#d7e0e8" stroke-width="1" x1="502" y1="29" x2="502" y2="268"/><text font-family="sans-serif" font-size="10" fill="#556779" x="502" y="290" text-anchor="middle" >$2.0m</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="24" text-anchor="start" >Home + employer pension</text><rect x="52" y="36" width="315" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="69" text-anchor="start" class="plot-value">$1,400,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="86" text-anchor="start" >Home, no employer pension</text><rect x="52" y="98" width="205.64999999999998" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="131" text-anchor="start" class="plot-value">$914,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="148" text-anchor="start" >Pension, no principal home</text><rect x="52" y="160" width="80.77499999999998" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="193" text-anchor="start" class="plot-value">$359,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="210" text-anchor="start" >Neither home nor pension</text><rect x="52" y="222" width="2.677500000000002" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="255" text-anchor="start" class="plot-value">$11,900</text><line stroke="#91aabd" stroke-width="1" x1="52" y1="29" x2="52" y2="268"/><line stroke="#91aabd" stroke-width="1" x1="52" y1="268" x2="502" y2="268"/></svg>