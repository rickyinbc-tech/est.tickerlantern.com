<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 324" width="520" height="324" role="img" aria-labelledby="parental-cash-difference-title parental-cash-difference-desc"><title id="parental-cash-difference-title">Reconcile the ending-cash difference over equal time</title><desc id="parental-cash-difference-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="314" text-anchor="middle" >-$50k</text><line stroke="#d7e0e8" stroke-width="1" x1="173" y1="14" x2="173" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="173" y="314" text-anchor="middle" >-$37.3k</text><line stroke="#d7e0e8" stroke-width="1" x1="282" y1="14" x2="282" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="282" y="314" text-anchor="middle" >-$24.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="391" y1="14" x2="391" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="391" y="314" text-anchor="middle" >-$11.8k</text><line stroke="#d7e0e8" stroke-width="1" x1="500" y1="14" x2="500" y2="290"/><line stroke="#d7e0e8" stroke-width="1" x1="491.45098039215685" y1="14" x2="491.45098039215685" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="491.45098039215685" y="314" text-anchor="middle" >$0</text><line stroke="#91aabd" stroke-width="1" x1="491.45098039215685" y1="14" x2="491.45098039215685" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Difference in net leave receipts</text><rect x="491.45098039215685" y="37" width="8.20705882352945" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#