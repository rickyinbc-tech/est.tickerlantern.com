<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="crash-signal-breakeven-title crash-signal-breakeven-desc"><title id="crash-signal-breakeven-title">Share of warnings that must be right just to break even</title><desc id="crash-signal-breakeven-desc">Scenario matrix. Darker cells mean larger values. Scale: 0.0% to 74.2%. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="22" text-anchor="middle" >1 year in cash</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="22" text-anchor="middle" >2 years in cash</text><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="22" text-anchor="middle" >3 years in cash</text><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="22" text-anchor="middle" >4 years in cash</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >Crash year −15%</text><rect x="111" y="44" width="98" height="54" fill="rgb(214,233,231)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="76" text-anchor="middle" class="plot-cell-label">15.2%</text><rect x="211" y="44" width="98" height="54" fill="#f0f3f5"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="76" text-anchor="middle" class="plot-cell-label">Not reachable</text><rect x="311" y="44" width="98" height="54" fill="#f0f3f5"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="76" text-anchor="middle" class="plot-cell-label">Not reachable</text><rect x="411" y="44" width="98" height="54" fill="#f0f3f5"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="76" text-anchor="middle" class="plot-cell-label">Not reachable</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >Crash year −25%</text><rect x="111" y="100" width="