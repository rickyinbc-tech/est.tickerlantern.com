<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="energy-cost-realization-title energy-cost-realization-desc"><title id="energy-cost-realization-title">NPV across upfront costs and realized bill savings</title><desc id="energy-cost-realization-desc">Scenario matrix. Negative values use gold; positive values use teal. Read the signed cell labels. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="22" text-anchor="middle" >$5k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="22" text-anchor="middle" >$10k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="22" text-anchor="middle" >$15k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="22" text-anchor="middle" >$20k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >50%</text><rect x="111" y="44" width="98" height="54" fill="rgb(229,240,239)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="76" text-anchor="middle" class="plot-cell-label">$1.5k</text><rect x="211" y="44" width="98" height="54" fill="rgb(235,229,214)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="76" text-anchor="middle" class="plot-cell-label">-$3.5k</text><rect x="311" y="44" width="98" height="54" fill="rgb(221,200,165)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="76" text-anchor="middle" class="plot-cell-label">-$8.5k</text><rect x="411" y="44" width="98" height="54" fill="rgb(206,172,117)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="76" text-anchor="middle" class="plot-cell-label">-$13.5k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >75%</text><rect x="111" y="100" width="98" height="54" fill="rgb(186,218,215)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="132" text-anchor="middle" class="plot-cell-label">$5.3k</text><rect x="211" y="100" width="98" height="54" fill="rgb(243,247,246)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="132" text-anchor="middle" class="plot-cell-label">$259.1</text><rect x="311" y="100" width="98" height="54" fill="rgb(232,222,202)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="132" text-anchor="middle" class="plot-cell-label">-$4.7k</text><rect x="411" y="100" width="98" height="54" fill="rgb(217,193,153)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="132" text-anchor="middle" class="plot-cell-label">-$9.7k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="188" text-anchor="end" >100%</text><rect x="111" y="156" width="98" height="54" fill="rgb(143,196,191)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="188" text-anchor="middle" class="plot-cell-label">$9k</text><rect x="211" y="156" width="98" height="54" fill="rgb(200,225,223)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="188" text-anchor="middle" class="plot-cell-label">$4k</text><rect x="311" y="156" width="98" height="54" fill="rgb(243,244,239)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="188" text-anchor="middle" class="plot-cell-label">-$950.6</text><rect x="411" y="156" width="98" height="54" fill="rgb(228,215,190)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="188" text-anchor="middle" class="plot-cell-label">-$6k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="244" text-anchor="end" >125%</text><rect x="111" y="212" width="98" height="54" fill="rgb(99,174,168)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="244" text-anchor="middle" class="plot-cell-label">$12.8k</text><rect x="211" y