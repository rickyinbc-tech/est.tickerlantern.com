amily="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Higher illustrative charge</text><rect x="369.2" y="104" width="9.156000000000006" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">+$10,500</text><line x1="378.356" x2="378.356" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Other entered exit costs</text><rect x="378.356" y="171" width="0.3487999999999829" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">+$400</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Total modeled payoff cash</text><rect x="64" y="238" width="314.7048" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">$360,900</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="290" x2="500" y2="290"/></svg>