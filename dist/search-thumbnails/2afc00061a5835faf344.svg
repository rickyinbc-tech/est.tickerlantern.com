<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="staged-draw-rate-spacing-title staged-draw-rate-spacing-desc"><title id="staged-draw-rate-spacing-title">How do borrowing rates and later project bills change the cost difference?</title><desc id="staged-draw-rate-spacing-desc">Scenario matrix. Negative values use gold; positive values use teal. Read the signed cell labels. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="22" text-anchor="middle" >4%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="22" text-anchor="middle" >8%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="22" text-anchor="middle" >12%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="22" text-anchor="middle" >16%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >1 mo gap</text><rect x="111" y="44" width="98" height="54" fill="rgb(246,249,248)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="76" text-anchor="middle" class="plot-cell-label">$0</text><rect x="211" y="44" width="98" height="54" fill="rgb(244,246,243)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="76" text-anchor="middle" class="plot-cell-label">-$200</text><rect x="311" y="44" width="98" height="54" fill="rgb(243,243,237)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="76" text-anchor="middle" class="plot-cell-label">-$400</text><rect x="411" y="44" width="98" height="54" fill="rgb(241,239,232)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="76" text-anchor="middle" class="plot-cell-label">-$600</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >2 mo gap</text><rect x="111" y="100" width="98" height