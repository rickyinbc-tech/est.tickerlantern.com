<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="cesg-delay-budget-title cesg-delay-budget-desc"><title id="cesg-delay-budget-title">New grants across waiting periods and annual contribution requests</title><desc id="cesg-delay-budget-desc">Scenario matrix. Darker cells mean larger values. Scale: $0 to $5k. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="22" text-anchor="middle" >$2.5k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="22" text-anchor="middle" >$3.5k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="22" text-anchor="middle" >$5k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="22" text-anchor="middle" >$7.5k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >0 yr wait</text><rect x="111" y="44" width="98" height="54" fill="rgb(169,209,206)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="76" text-anchor="middle" class="plot-cell-label">$2.5k</text><rect x="211" y="44" width="98" height="54" fill="rgb(138,193,189)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="76" text-anchor="middle" class="plot-cell-label">$3.5k</text><rect x="311" y="44" width="98" height="54" fill="rgb(91,170,164)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="76" text-anchor="middle" class="plot-cell-label">$5k</text><rect x="411" y="44" width="98" height="54" fill="rgb(91,170,164)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="76" text-anchor="middle" class="plot-cell-label">$5k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >1 yr wait</text><rect x="111" y="100" width="98" height="54" fill="rgb(184,217,214)"/><text font-family="sans-seri