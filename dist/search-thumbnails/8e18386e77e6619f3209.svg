<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 525" width="520" height="525" role="img" aria-labelledby="business-free-cash-title business-free-cash-desc"><title id="business-free-cash-title">Invoiced revenue is several steps away from uncommitted cash</title><desc id="business-free-cash-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="515" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="173" y1="14" x2="173" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="173" y="515" text-anchor="middle" >$50k</text><line stroke="#d7e0e8" stroke-width="1" x1="282" y1="14" x2="282" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="282" y="515" text-anchor="middle" >$100k</text><line stroke="#d7e0e8" stroke-width="1" x1="391" y1="14" x2="391" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="391" y="515" text-anchor="middle" >$150k</text><line stroke="#d7e0e8" stroke-width="1" x1="500" y1="14" x2="500" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="500" y="515" text-anchor="middle" >$200k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Starting cash</text><rect x="64" y="37" width="21.799999999999997" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$10,000</text><line x1="85.8" x2="85.8" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Twelve months of invoices</text><rect x="85.8" y="104" width="313.92" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">+$144,000</text><line x1="399.72" x2="399.72" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Operating cash costs</text><rect x="305.544" y="171" width="94.17600000000004" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">-$43,200</text><line x1="305.544" x2="305.544" y1="189" y2="238" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Owner withdrawals</text><rect x="200.904" y="238" width="104.63999999999999" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">-$48,000</text><line x1="200.904" x2="200.904" y1="256" y2="305" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="294" text-anchor="start" >Tax earmark target</text><rect x="145.96800000000002" y="305" width="54.93599999999998" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="339" text-anchor="start" class="plot-value">-$25,200</text><line x1="145.96800000000002" x2="145.96800000000002" y1="323" y2="372" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="361" text-anchor="start" >Invoices not yet collected</text><rect x="119.80799999999999" y="372" width="26.160000000000025" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="406" text-anchor="start" class="plot-value">-$12,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="428" text-anchor="start" >Year-end uncommitted cash</text><rect x="64" y="439" width="55.80799999999999" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="473" text-anchor="start" class="plot-value">$25,600</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="491" x2="500" y2="491"/></svg>