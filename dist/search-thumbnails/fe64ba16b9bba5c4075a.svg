<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 592" width="520" height="592" role="img" aria-labelledby="ed-waterfall-title ed-waterfall-desc"><title id="ed-waterfall-title">From the basic personal amount to the credit used</title><desc id="ed-waterfall-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="582" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="170.5" y1="14" x2="170.5" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="170.5" y="582" text-anchor="middle" >$5k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="14" x2="277" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="582" text-anchor="middle" >$10k</text><line stroke="#d7e0e8" stroke-width="1" x1="383.5" y1="14" x2="383.5" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="383.5" y="582" text-anchor="middle" >$15k</text><line stroke="#d7e0e8" stroke-width="1" x1="490" y1="14" x2="490" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="490" y="582" text-anchor="middle" >$20k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Claimant’s basic personal amount</text><rect x="64" y="37" width="350.4276" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$16,452</text><line x1="414.4276" x2="414.4276" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779