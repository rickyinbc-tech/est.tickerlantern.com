<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="tfsa-loss-withdrawal-grid-title tfsa-loss-withdrawal-grid-desc"><title id="tfsa-loss-withdrawal-grid-title">The withdrawal-based addback depends on the value actually taken out</title><desc id="tfsa-loss-withdrawal-grid-desc">Scenario matrix. Darker cells mean larger values. Scale: $0 to $12k. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="22" text-anchor="middle" >25% out</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="22" text-anchor="middle" >50% out</text><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="22" text-anchor="middle" >75% out</text><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="22" text-anchor="middle" >100% out</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >-40% move</text><rect x="111" y="44" width="98" height="54" fill="rgb(227,239,237)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="76" text-anchor="middle" class="plot-cell-label">$1.5k</text><rect x="211" y="44" width="98" height="54" fill="rgb(207,229,227)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="76" text-anchor="middle" class="plot-cell-label">$3k</text><rect x="311" y="44" width="98" height="54" fill="rgb(188,219,216)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="76" text-anchor="middle" class="plot-cell-label">$4.5k</text><rect x="411" y="44" width="98" height="54" fill="rgb(169,209,206)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="76" text-anchor="middle" class="plot-cell-label">$6k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >-20% move</text><rect x="111" y="100" width="98" height="54" fill=