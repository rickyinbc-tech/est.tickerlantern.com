<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 257" width="520" height="257" role="img" aria-labelledby="family-loan-cash-advance-title family-loan-cash-advance-desc"><title id="family-loan-cash-advance-title">The advance leaves accessible cash before any repayment is received</title><desc id="family-loan-cash-advance-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="247" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="170.5" y1="14" x2="170.5" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="170.5" y="247" text-anchor="middle" >$25k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="14" x2="277" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="247" text-anchor="middle" >$50k</text><line stroke="#d7e0e8" stroke-width="1" x1="383.5" y1="14" x2="383.5" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="383.5" y="247" text-anchor="middle" >$75k</text><line stroke="#d7e0e8" stroke-width="1" x1="490" y1="14" x2="490" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="490" y="247" text-anchor="middle" >$100k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Accessible cash before advance</text><rect x="64" y="37" width="255.60000000000002" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$60,000</text><line x1="319.6" x2="319.6" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Principal advanced to family</text><rect x="234.4" y="104" width="85.20000000000002" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">-$20,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Cash after the advance</text><rect x="64" y="171" width="170.4" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">$40,000</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="223" x2="490" y2="223"/></svg>