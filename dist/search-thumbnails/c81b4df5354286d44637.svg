 x="211" y="212" width="98" height="54" fill="rgb(169,209,206)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="244" text-anchor="middle" class="plot-cell-label">$6k</text><rect x="311" y="212" width="98" height="54" fill="rgb(130,190,185)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="244" text-anchor="middle" class="plot-cell-label">$9k</text><rect x="411" y="212" width="98" height="54" fill="rgb(91,170,164)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="244" text-anchor="middle" class="plot-cell-label">$12k</text></svg>