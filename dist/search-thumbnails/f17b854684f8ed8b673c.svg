<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="subscription-flexibility-matrix-title subscription-flexibility-matrix-desc"><title id="subscription-flexibility-matrix-title">Annual cost advantage compared with monthly billing</title><desc id="subscription-flexibility-matrix-desc">Scenario matrix. Darker cells mean larger values. Scale: -$210 to $60. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="22" text-anchor="middle" >0% refund</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="22" text-anchor="middle" >25%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="22" text-anchor="middle" >50%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="22" text-anchor="middle" >100%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >3 months used</text><rect x="111" y="44" width="98" height="54" fill="rgb(246,249,248)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="76" text-anchor="middle" class="plot-cell-label">-$210</text><rect x="211" y="44" width="98" height="54" fill="rgb(214,232,230)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="76" text-anchor="middle" class="plot-cell-label">-$153.8</text><rect x="311" y="44" width="98" height="54" fill="rgb(182,216,213)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="76" text-anchor="middle" class="plot-cell-label">-$97.5</text><rect x="411" y="44" width="98" height="54" fill="rgb(117,183,178)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="76" text-anchor="middle" class="plot-cell-label">$15</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >6 months used</text><rect x="111" y="100" width="98" height="54" fill="rgb(194,223,220)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="132" text-anchor="middle" class="plot-cell-label">-$120</text><rect x="211" y="100" width="98" height="54" fill="rgb(173,212,208)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="132" text-anchor="middle" class="plot-cell-label">-$82.5</text><rect x="311" y="100" width="98" height="54" fill="rgb(151,201,196)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="132" text-anchor="middle" class="plot-cell-label">-$45</text><rect x="411" y="100" width="98" height="54" fill="rgb(108,179,173)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="132" text-anchor="middle" class="plot-cell-label">$30</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="188" text-anchor="end" >9 months used</text><rect x="111" y="156" width="98" height="54" fill="rgb(143,196,192)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="188" text-anchor="middle" class="plot-cell-label">-$30</text><rect x="211" y="156" width="98" height="54" fill="rgb(132,191,186)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="188" text-anchor="middle" class="plot-cell-label">-$11.3</text><rect x="311" y="156" width="98" height="54" fill="rgb(121,185,180)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="188" text-anchor="middle" class="plot-cell-label">$7.5</text><rect x="411" y="156" width="98" height="54" fill="rgb(100,174,168)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="188" text-anchor="middle" class="plot-cell-label">$45</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="244" text-anchor="end" >12 months used</text><rect x="111" y="212" width="98" height="54" fill="rgb(91,170,164)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="244" text-anchor="middle" class="plot-cell-label">$60</text><rect x="211" y="212" width="98" height="54" fill="rgb(91,170,164)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="244" text-anchor="middle" class="plot-cell-label">$60</text><rect x="311" y="212" width="98" height="54" fill="rgb(91,170,164)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="244" text-anchor="middle" class="plot-cell-label">$60</text><rect x="411" y="212" width="98" height="54" fill="rgb(91,170,164)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="244" text-anchor="middle" class="plot-cell-label">$60</text></svg>