y="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Six months of receipts excluding tax</text><rect x="85.8" y="104" width="261.6" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">+$60,000</text><line x1="347.40000000000003" x2="347.40000000000003" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Six months of output tax received</text><rect x="347.40000000000003" y="171" width="34.00799999999998" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">+$7,800</text><line x1="381.408" x2="381.408" y1="189" y2="238" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Operating cash payments excluding tax</text><rect x="224.448" y="238" width="156.96" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">-$36,000</text><line x1="224.448" x2="224.448" y1="256" y2="305" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="294" text-anchor="start" >Input tax paid with those costs</text><rect x="213.98399999999998" y="305" width="10.464000000000027" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="339" text-anchor="start" class="plot-value">-$2,400</text><line x1="213.98399999999998" x2="213.98399999999998" y1="323" y2="372" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="361" text-anchor="start" >First-period positive tax remitted</text><rect x="202.212" y="372" width="11.771999999999991" height="18" fill="#b8822e"/><t