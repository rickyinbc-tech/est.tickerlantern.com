<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 176" width="520" height="176" role="img" aria-labelledby="repeated-risk-dependence-tail-title repeated-risk-dependence-tail-desc"><title id="repeated-risk-dependence-tail-title">The same annual probability and expected cost can produce different tail costs</title><desc id="repeated-risk-dependence-tail-desc">Horizontal bar chart. CAD; value axis starts at zero. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="52" y1="29" x2="52" y2="144"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="166" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="164.5" y1="29" x2="164.5" y2="144"/><text font-family="sans-serif" font-size="10" fill="#556779" x="164.5" y="166" text-anchor="middle" >$5k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="29" x2="277" y2="144"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="166" text-anchor="middle" >$10k</text><line stroke="#d7e0e8" stroke-width="1" x1="389.5" y1="29" x2="389.5" y2="144"/><text font-family="sans-serif" font-size="10" fill="#556779" x="389.5" y="166" text-anchor="middle" >$15k</text><line stroke="#d7e0e8" stroke-width="1" x1="502" y1="29" x2="502" y2="144"/><text font-family="sans-serif" font-size="10" fill="#556779" x="502" y="166" text-anchor="middle" >$20k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="24" text-anchor="start" >95th-percentile cost: independent years</text><rect x="52" y="36" width="135" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="69" text-anchor="start" class="plot-value">$6,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="86" text-anchor="start" >95th-percentile cost: fully linked years</text><rect x="52" y="98" width="337.5" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10"