<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 462" width="520" height="462" role="img" aria-labelledby="rrsp-tax-comparison-title rrsp-tax-comparison-desc"><title id="rrsp-tax-comparison-title">Compare prepaid withholding with an independent tax assumption</title><desc id="rrsp-tax-comparison-desc">Horizontal grouped bar chart. CAD; value axis starts at zero. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="52" y1="29" x2="52" y2="430"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="452" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="164.5" y1="29" x2="164.5" y2="430"/><text font-family="sans-serif" font-size="10" fill="#556779" x="164.5" y="452" text-anchor="middle" >$1.3k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="29" x2="277" y2="430"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="452" text-anchor="middle" >$2.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="389.5" y1="29" x2="389.5" y2="430"/><text font-family="sans-serif" font-size="10" fill="#556779" x="389.5" y="452" text-anchor="middle" >$3.8k</text><line stroke="#d7e0e8" stroke-width="1" x1="502" y1="29" x2="502" y2="430"/><text font-family="sans-serif" font-size="10" fill="#556779" x="502" y="452" text-anchor="middle" >$5k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="24" text-anchor="start" >10% final-tax assumption</text><rect x="52" y="34" width="180" height="13" fill="#087f76"/><rect x="52" y="54" width="90" height="13" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="89" text-anchor="start" class="plot-value">$2,000 / $1,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="106" text-anchor="start" >20% final-tax assumption</text><rect x="52" y="116" width="180" height="13" fill="#087f76"/><rect x="52" y="136" width="180" height="13" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="171" text-anchor="start" class="plot-value">$2,000 / $2,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="188" text-anchor="start" >30% final-tax assumption</text><rect x="52" y="198" width="180" height="13" fill="#087f76"/><rect x="52" y="218" width="270" height="13" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="253" text-anchor="start" class="plot-value">$2,000 / $3,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="270" text-anchor="start" >40% final-tax assumption</text><rect x="52" y="280" width="180" height="13" fill="#087f76"/><rect x="52" y="300" width="360" height="13" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="335" text-anchor="start" class="plot-value">$2,000 / $4,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="352" text-anchor="start" >50% final-tax assumption</text><rect x="52" y="362" width="180" height="13" fill="#087f76"/><rect x="52" y="382" width="450" height="13" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="417" text-anchor="start" class="plot-value">$2,000 / $5,000</text><line stroke="#91aabd" stroke-width="1" x1="52" y1="29" x2="52" y2="430"/><line stroke="#91aabd" stroke-width="1" x1="52" y1="430" x2="502" y2="430"/></svg>