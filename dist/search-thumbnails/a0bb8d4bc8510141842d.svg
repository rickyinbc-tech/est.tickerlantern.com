<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" width="520" height="270" role="img" aria-labelledby="lookthrough-asset-partition-title lookthrough-asset-partition-desc"><title id="lookthrough-asset-partition-title">Read asset class as another partition of the same portfolio</title><desc id="lookthrough-asset-partition-desc">Donut chart showing the composition of listed gross assets, before debt. Zero total assets produce an empty ring. Exact values are available in the chart data table below.</desc><circle cx="260" cy="130" r="86" fill="none" stroke="#e3ebed" stroke-width="34"/><circle cx="260" cy="130" r="86" fill="none" stroke="#087f76" stroke-width="34" pathLength="100" stroke-dasharray="72 28" stroke-dashoffset="0" transform="rotate(-90 260 130)"/><circle cx="260" cy="130" r="86" fill="none" stroke="#102f50" stroke-width="34" pathLength="100" stroke-dasharray="28.000000000000004 72" stroke-dashoffset="-72" transform="rotate(-90 260 130)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="123" text-anchor="middle" class="plot-donut-total">$100k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="150" text-anchor="middle" >Total listed assets</text></svg>