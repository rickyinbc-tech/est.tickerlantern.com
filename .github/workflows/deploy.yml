name: Deploy site to Cloudflare
# Rebuilds dist and runs `wrangler deploy` so pushed guides and the baked-in
# homepage snapshot go live without a manual deploy from the owner's Mac.
# Requires repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts:Edit +
# Workers Routes/Custom Domains for tickerlantern.com) and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
  # The daily data refresh pushes with GITHUB_TOKEN, which does not fire `push`.
  workflow_run:
    workflows: ['Refresh public index observations']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip when Cloudflare secrets are not configured
        id: guard
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set; skipping deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          ref: main
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Test
        if: steps.guard.outputs.ready == 'true'
        run: npm test
      - name: Build and deploy (wrangler runs `npm run build`)
        if: steps.guard.outputs.ready == 'true'
        run: npx --yes wrangler@4 deploy
