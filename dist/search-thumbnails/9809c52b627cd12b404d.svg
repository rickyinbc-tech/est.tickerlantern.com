<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 525" width="520" height="525" role="img" aria-labelledby="shared-cash-ledger-title shared-cash-ledger-desc"><title id="shared-cash-ledger-title">Changing the split does not change household resources</title><desc id="shared-cash-ledger-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="515" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="173" y1="14" x2="173" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="173" y="515" text-anchor="middle" >$2.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="282" y1="14" x2="282" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="282" y="515" text-anchor="middle" >$5k</text><line stroke="#d7e0e8" stroke-width="1" x1="391" y1="14" x2="391" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="391" y="515" text-anchor="middle" >$7.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="500" y1="14" x2="500" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="500" y="515" text-anchor="middle" >$10k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Person A take-home income</text><rect x="64" y="37" width="218" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$5,000</text><line x1="282" x2="282" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x=