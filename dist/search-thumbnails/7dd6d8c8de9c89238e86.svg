<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 391" width="520" height="391" role="img" aria-labelledby="deposit-access-bridge-reconciliation-title deposit-access-bridge-reconciliation-desc"><title id="deposit-access-bridge-reconciliation-title">The locked maturity must repay the bridge before cash is free to spend</title><desc id="deposit-access-bridge-reconciliation-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="381" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="170.5" y1="14" x2="170.5" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="170.5" y="381" text-anchor="middle" >$6.3k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="14" x2="277" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="381" text-anchor="middle" >$12.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="383.5" y1="14" x2="383.5" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="383.5" y="381" text-anchor="middle" >$18.8k</text><line stroke="#d7e0e8" stroke-width="1" x1="490" y1="14" x2="490" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="490" y="381" text-anchor="middle" >$25k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Original locked principal returned</text><rect x="64" y="37" width="340.8" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$20,000</text><line x1="404.8" x2="404.8" y