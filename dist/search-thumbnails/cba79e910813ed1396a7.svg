ue">$17,300</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="148" text-anchor="start" >2 full-month collection delay</text><rect x="52" y="160" width="121.5" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="193" text-anchor="start" class="plot-value">$27,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="210" text-anchor="start" >3 full-month collection delay</text><rect x="52" y="222" width="165.15" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="255" text-anchor="start" class="plot-value">$36,700</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="272" text-anchor="start" >6 full-month collection delay</text><rect x="52" y="284" width="296.1" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="317" text-anchor="start" class="plot-value">$65,800</text><line stroke="#91aabd" stroke-width="1" x1="52" y1="29" x2="52" y2="330"/><line stroke="#91aabd" stroke-width="1" x1="52" y1="330" x2="502" y2="330"/></svg>