<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 324" width="520" height="324" role="img" aria-labelledby="card-grace-cash-bridge-title card-grace-cash-bridge-desc"><title id="card-grace-cash-bridge-title">Reconcile the planned full payment with the available cash</title><desc id="card-grace-cash-bridge-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="290"/><line stroke="#d7e0e8" stroke-width="1" x1="173" y1="14" x2="173" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="173" y="314" text-anchor="middle" >$462.5</text><line stroke="#d7e0e8" stroke-width="1" x1="282" y1="14" x2="282" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="282" y="314" text-anchor="middle" >$975</text><line stroke="#d7e0e8" stroke-width="1" x1="391" y1="14" x2="391" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="391" y="314" text-anchor="middle" >$1.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="500" y1="14" x2="500" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="500" y="314" text-anchor="middle" >$2k</text><line stroke="#d7e0e8" stroke-width="1" x1="74.63414634146342" y1="14" x2="74.63414634146342" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="74.63414634146342" y="314" text-anchor="middle" >$0</text><line stroke="#91aabd" stroke-width="1" x1="74.63414634146342" y1="14" x2="74.63414634146342" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Cash already assigned when the purchase posts</text><rect x="74.63414634146342" y="37" width="212.6829268292683" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$1,000</text><line x1="287.3170731707317" x2="287.3170731707317" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >New allocations before the due-date payment</text><rect x="287.3170731707317" y="104" width="97.8341463414634" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">+$460</text><line x1="385.1512195121951" x2="385.1512195121951" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Full statement-payment target</text><rect x="66.12682926829268" y="171" width="319.0243902439024" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">-$1,500</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Provisional cash after the planned full payment</text><rect x="66.12682926829268" y="238" width="8.50731707317074" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">-$40</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="290" x2="500" y2="290"/></svg>