<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 458" width="520" height="458" role="img" aria-labelledby="car-cost-title car-cost-desc"><title id="car-cost-title">Reconcile cash paid with the value recovered at sale</title><desc id="car-cost-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="448" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="170.5" y1="14" x2="170.5" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="170.5" y="448" text-anchor="middle" >$25k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="14" x2="277" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="448" text-anchor="middle" >$50k</text><line stroke="#d7e0e8" stroke-width="1" x1="383.5" y1="14" x2="383.5" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="383.5" y="448" text-anchor="middle" >$75k</text><line stroke="#d7e0e8" stroke-width="1" x1="490" y1="14" x2="490" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="490" y="448" text-anchor="middle" >$100k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Down payment</text><rect x="64" y="37" width="33.22800000000001" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$7,800</text><line x1="97.22800000000001" x2="97.22800000000001" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="