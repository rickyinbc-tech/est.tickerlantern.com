<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" width="520" height="350" role="img" aria-labelledby="adjusted-income-relative-scatter-title adjusted-income-relative-scatter-desc"><title id="adjusted-income-relative-scatter-title">Similar non-cash amounts can represent different shares of adjusted income</title><desc id="adjusted-income-relative-scatter-desc">Scatter chart. Horizontal axis: Disposable income (CAD). Vertical axis: In-kind transfers / adjusted income. The larger filled point marks the selected income group; hollow points mark the other groups. Each point combines published annual group means with a ratio calculated from those means. Points are not individual households or simulated investment outcomes. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="25" x2="64" y2="292"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="316" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="292" x2="498" y2="292"/><text font-family="sans-serif" font-size="10" fill="#556779" x="55" y="296" text-anchor="end" >0.0%</text><line stroke="#d7e0e8" stroke-width="1" x1="172.5" y1="25" x2="172.5" y2="292"/><text font-family="sans-serif" font-size="10" fill="#556779" x="172.5" y="316" text-anchor="middle" >$62.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="225.25" x2="498" y2="225.25"/><text font-family="sans-serif" font-size="10" fill="#556779" x="55" y="229.25" text-anchor="end" >12.5%</text><line stroke="#d7e0e8" stroke-width="1" x1="281" y1="25" x2="281" y2="292"/><text font-family="sans-serif" font-size="10" fill="#556779" x="281" y="316" text-anchor="middle" >$125k</text><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="158.5" x2="498" y2="158.5"/><text font-family="sans-serif" font-size="10" fill="#556779" x="55" y="162.5" text-anchor="end" >25.0%</text><line stroke="#d7e0e8" stroke-width="1" x1="389.5" y1="25" x2="389.5" y2="292"/><text font-family="sans-serif" font-size="10" fill="#556779" x="389.5" y="316" text-anchor="middle" >$188k</text><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="91.75" x2="498" y2="91.75"/><text font-family="sans-serif" font-size="10" fill="#556779" x="55" y="95.75" text-anchor="end" >37.5%</text><line stroke="#d7e0e8" stroke-width="1" x1="498" y1="25" x2="498" y2="292"/><text font-family="sans-serif" font-size="10" fill="#556779" x="498" y="316" text-anchor="middle" >$250k</text><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="25" x2="498" y2="25"/><text font-family="sans-serif" font-size="10" fill="#556779" x="55" y="29" text-anchor="end" >50.0%</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="25" x2="64" y2="292"/><line stroke="#91aabd" stroke-width="1" x1="64" y1="292" x2="498" y2="292"/><circle cx="120.944272" cy="34.24261540159915" r="3.5" fill="white" stroke="#102f50" stroke-width="1.5" tabindex="0" role="img" aria-label="Lowest: Disposable income (CAD) $32,802, In-kind transfers / adjusted income 48.27%"><title>Lowest: $32,802 / 48.27%</title></circle><circle cx="172.328136" cy="108.34626545546303" r="3.5" fill="white" stroke="#102f50" stroke-width="1.5" tabindex="0" role="img" aria-label="Second: Disposable income (CAD) $62,401, In-kind transfers / adjusted income 34.39%"><title>Second: $62,401 / 34.39%</title></circle><circle cx="272.635952" cy="183.88317893451546" r="3.5" fill="white" stroke="#102f50" stroke-width="1.5" tabindex="0" role="img" aria-label="Fourth: Disposable income (CAD) $120,182, In-kind transfers / adjusted income 20.25%"><title>Fourth: $120,182 / 20.25%</title></circle><circle cx="444.289896" cy="232.14455545872767" r="3.5" fill="white" stroke="#102f50" stroke-width="1.5" tabindex="0" role="img" aria-label="Highest: Disposable income (CAD) $219,061, In-kind transfers / adjusted income 11.21%"><title>Highest: $219,061 / 11.21%</title></circle><circle cx="216.25588000000002" cy="149.55981941309255" r="5.5" fill="#