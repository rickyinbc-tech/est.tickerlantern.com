<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 391" width="520" height="391" role="img" aria-labelledby="wealth-composition-title wealth-composition-desc"><title id="wealth-composition-title">Build the hypothetical balance sheet from separate net assets</title><desc id="wealth-composition-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="381" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="170.5" y1="14" x2="170.5" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="170.5" y="381" text-anchor="middle" >$250k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="14" x2="277" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="381" text-anchor="middle" >$500k</text><line stroke="#d7e0e8" stroke-width="1" x1="383.5" y1="14" x2="383.5" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="383.5" y="381" text-anchor="middle" >$750k</text><line stroke="#d7e0e8" stroke-width="1" x1="490" y1="14" x2="490" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="490" y="381" text-anchor="middle" >$1.0m</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Net home equity</text><rect x="64" y="37" width="255.60000000000002" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$600,000</text><line x1="319.6" x2="319.6" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Pension and restricted assets</text><rect x="319.6" y="104" width="106.49999999999994" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">+$250,000</text><line x1="426.09999999999997" x2="426.09999999999997" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Other investments</text><rect x="426.09999999999997" y="171" width="42.60000000000002" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">+$100,000</text><line x1="468.7" x2="468.7" y1="189" y2="238" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Uncommitted immediate cash</text><rect x="468.7" y="238" width="8.519999999999982" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">+$20,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="294" text-anchor="start" >Hypothetical net worth</text><rect x="64" y="305" width="413.21999999999997" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="339" text-anchor="start" class="plot-value">$970,000</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="357" x2="490" y2="357"/></svg>