<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 482" width="520" height="482" role="img" aria-labelledby="debt-holder-median-title debt-holder-median-desc"><title id="debt-holder-median-title">How much did the middle holder of each debt type owe?</title><desc id="debt-holder-median-desc">Horizontal bar chart. CAD; value axis starts at zero. Whiskers show the published lower and upper bounds of a 95% confidence interval around each estimate. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="52" y1="29" x2="52" y2="450"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="472" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="164.5" y1="29" x2="164.5" y2="450"/><text font-family="sans-serif" font-size="10" fill="#556779" x="164.5" y="472" text-anchor="middle" >$62.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="29" x2="277" y2="450"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="472" text-anchor="middle" >$125k</text><line stroke="#d7e0e8" stroke-width="1" x1="389.5" y1="29" x2="389.5" y2="450"/><text font-family="sans-serif" font-size="10" fill="#556779" x="389.5" y="472" text-anchor="middle" >$188k</text><line stroke="#d7e0e8" stroke-width="1" x1="502" y1="29" x2="502" y2="450"/><text font-family="sans-serif" font-size="10" fill="#556779" x="502" y="472" text-anchor="middle" >$250k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="24" text-anchor="start" >Mortgage debt</text><rect x="52" y="36" width="369" height="18" fill="#087f76"/><path d="M412,45H439M412,40V50M439,40V50" fill="none" stroke="white" stroke-width="4"/><path d="M412,45H439M412,40V50M439,40V50" fill="none" stroke="#102f50" stroke-width="1.6"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="89" text-anchor="start" class="plot-value">95% CI: $200,000–$215,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="69" text-anchor="start" class="plot-value">$205,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="110" text-anchor="start" >Lines of credit</text><rect x="52" y="122" width="36" height="18" fill="#087f76"/><path d="M84.4,131H88M84.4,126V136M88,126V136" fill="none" stroke="white" stroke-width="4"/><path d="M84.4,131H88M84.4,126V136M88,126V136" fill="none" stroke="#102f50" stroke-width="1.6"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="175" text-anchor="start" class="plot-value">95% CI: $18,000–$20,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="155" text-anchor="start" class="plot-value">$20,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="196" text-anchor="start" >Credit card and instalment</text><rect x="52" y="208" width="8.100000000000001" height="18" fill="#087f76"/><path d="M59.2,217H61M59.2,212V222M61,212V222" fill="none" stroke="white" stroke-width="4"/><path d="M59.2,217H61M59.2,212V222M61,212V222" fill="none" stroke="#102f50" stroke-width="1.6"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="261" text-anchor="start" class="plot-value">95% CI: $4,000–$5,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="241" text-anchor="start" class="plot-value">$4,500</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="282" text-anchor="start" >Student loans</text><rect x="52" y="294" width="25.200000000000003" height="18" fill="#087f76"/><path d="M73.6,303H79M73.6,298V308M79,298V308" fill="none" stroke="white" stroke-width="4"/><path d="M73.6,303H79M73.6,298V308M79,298V308" fill="none" stroke="#102f50" stroke-width="1.6"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="347" text-anchor="start" class="plot-value">95% CI: $12,000–$15,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="327" text