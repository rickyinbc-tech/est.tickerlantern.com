<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" width="520" height="270" role="img" aria-labelledby="arrears-fictional-account-share-title arrears-fictional-account-share-desc"><title id="arrears-fictional-account-share-title">Use all eight accounts when the selected numerator is assigned 90+</title><desc id="arrears-fictional-account-share-desc">Eight fictional accounts, each belonging to exactly one of four fictional borrowers. Only code 2 enters the assigned 90+ numerator; lower assigned codes remain in the denominator. Exact values are available in the chart data table below.</desc><circle cx="260" cy="130" r="86" fill="none" stroke="#e3ebed" stroke-width="34"/><circle cx="260" cy="130" r="86" fill="none" stroke="#087f76" stroke-width="34" pathLength="100" stroke-dasharray="75 25" stroke-dashoffset="0" transform="rotate(-90 260 130)"/><circle cx="260" cy="130" r="86" fill="none" stroke="#102f50" stroke-width="34" pathLength="100" stroke-dasharray="25 75" stroke-dashoffset="-75" transform="rotate(-90 260 130)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="123" text-anchor="middle" class="plot-donut-total">8</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="150" text-anchor="middle" >Fictional accounts</text></svg>