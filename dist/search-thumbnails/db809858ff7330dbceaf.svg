<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 458" width="520" height="458" role="img" aria-labelledby="etf-execution-bridge-title etf-execution-bridge-desc"><title id="etf-execution-bridge-title">Reconcile midpoint movement with the net trading result</title><desc id="etf-execution-bridge-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="448" text-anchor="middle" >-$50</text><line stroke="#d7e0e8" stroke-width="1" x1="173" y1="14" x2="173" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="173" y="448" text-anchor="middle" >-$37.5</text><line stroke="#d7e0e8" stroke-width="1" x1="282" y1="14" x2="282" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="282" y="448" text-anchor="middle" >-$25</text><line stroke="#d7e0e8" stroke-width="1" x1="391" y1="14" x2="391" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="391" y="448" text-anchor="middle" >-$12.5</text><line stroke="#d7e0e8" stroke-width="1" x1="500" y1="14" x2="500" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="500" y="448" text-anchor="middle" >$0</text><line stroke="#91aabd" stroke-width="1" x1="500" y1="14" x2="500" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Gain or loss from quote-midpoint movement</text><rect x="500" y="37" width="0" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">$0</text><line x1="500" x2="500" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Entry price above its midpoint</text><rect x="412.80000000000496" y="104" width="87.19999999999504" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">-$10</text><line x1="412.80000000000496" x2="412.80000000000496" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Exit price below its midpoint</text><rect x="325.6000000000099" y="171" width="87.19999999999504" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">-$10</text><line x1="325.6000000000099" x2="325.6000000000099" y1="189" y2="238" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Entry commissions</text><rect x="282.0000000000099" y="238" width="43.60000000000002" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">-$5</text><line x1="282.0000000000099" x2="282.0000000000099" y1="256" y2="305" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="294" text-anchor="start" >Exit commissions</text><rect x="238.4000000000099" y="305" width="43.599999999999994" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="339" text-anchor="start" class="plot-value">-$5</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="361" text-anchor="start" >Net gain or loss on the completed round trip</text><rect x="238.4000000000099" y="372" width="261.59999999999013" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="406" text-anchor="start