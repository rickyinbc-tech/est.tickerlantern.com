<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 298" width="520" height="298" role="img" aria-labelledby="graduate-debt-invented-selection-example-title graduate-debt-invented-selection-example-desc"><title id="graduate-debt-invented-selection-example-title">An invented example: every balance falls, while the still-owing median rises</title><desc id="graduate-debt-invented-selection-example-desc">Horizontal grouped bar chart. CAD; value axis starts at zero. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="52" y1="29" x2="52" y2="266"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="288" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="164.5" y1="29" x2="164.5" y2="266"/><text font-family="sans-serif" font-size="10" fill="#556779" x="164.5" y="288" text-anchor="middle" >$12.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="29" x2="277" y2="266"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="288" text-anchor="middle" >$25k</text><line stroke="#d7e0e8" stroke-width="1" x1="389.5" y1="29" x2="389.5" y2="266"/><text font-family="sans-serif" font-size="10" fill="#556779" x="389.5" y="288" text-anchor="middle" >$37.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="502" y1="29" x2="502" y2="266"/><text font-family="sans-serif" font-size="10" fill="#556779" x="502" y="288" text-anchor="middle" >$50k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="24" text-anchor="start" >Invented borrower A: fully repays</text><rect x="52" y="34" width="90" height="13" fill="#087f76"/><rect x="52" y="54" width="0" height="13" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="89" text-anchor="start" class="plot-value">$10,000 / $0</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="106" text-anchor="start" >Invented borrower B: repays CAD 1,000</text><rect x="52" y="116" width="180" height="13" fill="#087f76"/><rect x="52" y="136" width="171" height="13" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="171" text-anchor="start" class="plot-value">$20,000 / $19,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="188" text-anchor="start" >Invented borrower C: repays CAD 1,000</text><rect x="52" y="198" width="270" height="13" fill="#087f76"/><rect x="52" y="218" width="261" height="13" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="253" text-anchor="start" class="plot-value">$30,000 / $29,000</text><line stroke="#91aabd" stroke-width="1" x1="52" y1="29" x2="52" y2="266"/><line stroke="#91aabd" stroke-width="1" x1="52" y1="266" x2="502" y2="266"/></svg>