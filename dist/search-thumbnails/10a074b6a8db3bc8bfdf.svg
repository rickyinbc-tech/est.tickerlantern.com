<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="price-basis-rate-matrix-title price-basis-rate-matrix-desc"><title id="price-basis-rate-matrix-title">Recalculate a consistent present cost when inflation and the nominal discount rate change</title><desc id="price-basis-rate-matrix-desc">Scenario matrix. Darker cells mean larger values. Scale: $0 to $279k. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="22" text-anchor="middle" >0%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="22" text-anchor="middle" >3%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="22" text-anchor="middle" >5%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="22" text-anchor="middle" >8%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >0% prices</text><rect x="111" y="44" width="98" height="54" fill="rgb(135,192,188)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="76" text-anchor="middle" class="plot-cell-label">$200k</text><rect x="211" y="44" width="98" height="54" fill="rgb(152,201,196)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="76" text-anchor="middle" class="plot-cell-label">$171k</text><rect x="311" y="44" width="98" height="54" fill="rgb(161,205,201)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="76" text-anchor="middle" class="plot-cell-label">$154k</text><rect x="411" y="44" width="98" height="54" fill="rgb(172,211,207)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="76" text-anchor="middle" class="plot-cell-label">$134k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >2% prices</text><rect x="111" y="100" width="98" height="54" fill="rg