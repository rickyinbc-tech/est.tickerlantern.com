<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" width="520" height="270" role="img" aria-labelledby="payment-shares-fictional-dollars-title payment-shares-fictional-dollars-desc"><title id="payment-shares-fictional-dollars-title">Then weight the same tally by purchase dollars</title><desc id="payment-shares-fictional-dollars-desc">Donut of fictional purchase dollars by method, not income or debt balances. Positive counts with zero prices can have a valid count distribution but undefined dollar shares and an empty dollar ring. Exact values are available in the chart data table below.</desc><circle cx="260" cy="130" r="86" fill="none" stroke="#e3ebed" stroke-width="34"/><circle cx="260" cy="130" r="86" fill="none" stroke="#087f76" stroke-width="34" pathLength="100" stroke-dasharray="6 94" stroke-dashoffset="0" transform="rotate(-90 260 130)"/><circle cx="260" cy="130" r="86" fill="none" stroke="#102f50" stroke-width="34" pathLength="100" stroke-dasharray="24 76" stroke-dashoffset="-6" transform="rotate(-90 260 130)"/><circle cx="260" cy="130" r="86" fill="none" stroke="#b8822e" stroke-width="34" pathLength="100" stroke-dasharray="70 30" stroke-dashoffset="-30" transform="rotate(-90 260 130)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="123" text-anchor="middle" class="plot-donut-total">$500</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="150" text-anchor="middle" >Purchase dollars</text></svg>