name: Refresh public index observations
on:
  schedule:
    - cron: '15 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: index-source-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pypdf==6.14.2 Pillow==12.3.0 playwright==1.64.1
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr
      - run: python -m playwright install --with-deps --no-shell chromium
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check public publisher sources
        id: source_refresh
        continue-on-error: true
        env:
          PUBLIC_BROWSER_FETCH: '1'
        run: python scripts/refresh_indices.py
      - name: Check annual index earnings-growth forecasts
        id: growth_refresh
        continue-on-error: true
        run: python scripts/refresh_growth.py
      - run: npm test
      - name: Publish changed observation snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/indices.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh dated public index observations'
            git push
          fi
      - name: Report unavailable publisher jobs after retaining verified data
        if: steps.source_refresh.outcome == 'failure' || steps.growth_refresh.outcome == 'failure'
        run: exit 1
