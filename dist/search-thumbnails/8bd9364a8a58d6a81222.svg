<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="callable-bond-reinvestment-grid-title callable-bond-reinvestment-grid-desc"><title id="callable-bond-reinvestment-grid-title">Test the call year and the return available after receipts arrive</title><desc id="callable-bond-reinvestment-grid-desc">Scenario matrix. Negative values use gold; positive values use teal. Read the signed cell labels. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="22" text-anchor="middle" >0%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="22" text-anchor="middle" >2%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="22" text-anchor="middle" >4%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="22" text-anchor="middle" >6%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >Call year 1</text><rect x="111" y="44" width="98" height="54" fill="rgb(206,172,117)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="76" text-anchor="middle" class="plot-cell-label">-$5.4k</text><rect x="211" y="44" width="98" height="54" fill="rgb(217,193,153)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="76" text-anchor="middle" class="plot-cell-label">-$3.9k</text><rect x="311" y="44" width="98" height="54" fill="rgb(230,219,197)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="76" text-anchor="middle" class="plot-cell-label">-$2.1k</text><rect x="411" y="44" width="98" height="54" fill="rgb(246,249,248)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="76" text-anchor="middle" class="plot-cell-label">$0</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >Call year 2</text><rect x="111"