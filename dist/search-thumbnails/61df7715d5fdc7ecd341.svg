<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 176" width="520" height="176" role="img" aria-labelledby="employer-assets-shock-title employer-assets-shock-desc"><title id="employer-assets-shock-title">A single-company loss changes one part of the balance sheet</title><desc id="employer-assets-shock-desc">Horizontal stacked bar chart. CAD; value axis starts at zero. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="52" y1="29" x2="52" y2="144"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="166" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="164.5" y1="29" x2="164.5" y2="144"/><text font-family="sans-serif" font-size="10" fill="#556779" x="164.5" y="166" text-anchor="middle" >$62.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="29" x2="277" y2="144"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="166" text-anchor="middle" >$125k</text><line stroke="#d7e0e8" stroke-width="1" x1="389.5" y1="29" x2="389.5" y2="144"/><text font-family="sans-serif" font-size="10" fill="#556779" x="389.5" y="166" text-anchor="middle" >$188k</text><line stroke="#d7e0e8" stroke-width="1" x1="502" y1="29" x2="502" y2="144"/><text font-family="sans-serif" font-size="10" fill="#556779" x="502" y="166" text-anchor="middle" >$250k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="24" text-anchor="start" >Before the joint stress</text><rect x="52" y="36" width="21.599999999999994" height="18" fill="#087f76"/><rect x="73.6" y="36" width="108" height="18" fill="#102f50"/><rect x="181.6" y="36" width="252" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="69" text-anchor="start" class="plot-value">$212,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="86" text-anchor="start" >After the share-price shock, before any sale</text><rect x="52" y