<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 392" width="520" height="392" role="img" aria-labelledby="donate-kind-grid-title donate-kind-grid-desc"><title id="donate-kind-grid-title">Tax saved by giving the units instead of selling first, on a $20,000 gift</title><desc id="donate-kind-grid-desc">Scenario matrix. Darker cells mean larger values. Scale: $0 to $5k. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="22" text-anchor="middle" >20% marginal rate</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="22" text-anchor="middle" >30% marginal rate</text><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="22" text-anchor="middle" >40% marginal rate</text><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="22" text-anchor="middle" >50% marginal rate</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >0% of value</text><rect x="111" y="44" width="98" height="54" fill="rgb(184,217,214)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="76" text-anchor="middle" class="plot-cell-label">$2k</text><rect x="211" y="44" width="98" height="54" fill="rgb(153,201,197)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="76" text-anchor="middle" class="plot-cell-label">$3k</text><rect x="311" y="44" width="98" height="54" fill="rgb(122,186,180)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="76" text-anchor="middle" class="plot-cell-label">$4k</text><rect x="411" y="44" width="98" height="54" fill="rgb(91,170,164)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="76" text-anchor="middle" class="plot-cell-label">$5k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >20% of value</text><rect x="111" y="100" width="98" height="54