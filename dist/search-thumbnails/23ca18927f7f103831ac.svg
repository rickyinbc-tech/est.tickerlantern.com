<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="record-high-grid-title record-high-grid-desc"><title id="record-high-grid-title">Share of starting months after which the index plus 2.5% yield, less a 0.5% fee, beat 3% cash</title><desc id="record-high-grid-desc">Scenario matrix. Darker cells mean larger values. Scale: 0.0% to 100.0%. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="22" text-anchor="middle" >1 year</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="22" text-anchor="middle" >3 years</text><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="22" text-anchor="middle" >5 years</text><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="22" text-anchor="middle" >10 years</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >At a record close</text><rect x="111" y="44" width="98" height="54" fill="rgb(169,209,206)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="76" text-anchor="middle" class="plot-cell-label">50.0%</text><rect x="211" y="44" width="98" height="54" fill="rgb(153,201,197)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="76" text-anchor="middle" class="plot-cell-label">60.2%</text><rect x="311" y="44" width="98" height="54" fill="rgb(131,190,185)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="76" text-anchor="middle" class="plot-cell-label">74.2%</text><rect x="411" y="44" width="98" height="54" fill="rgb(106,177,171)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="76" text-anchor="middle" class="plot-cell-label">90.8%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >Up to 10% below the peak</text><rect x="111" y="100" width="98" height="54" fill="rgb(165,207,204)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="132" text-anchor="middle" class="plot-cell-label">52.4%</text><rect x="211" y="100" width="98" height="54" fill="rgb(143,196,192)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="132" text-anchor="middle" class="plot-cell-label">66.4%</text><rect x="311" y="100" width="98" height="54" fill="rgb(127,188,183)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="132" text-anchor="middle" class="plot-cell-label">76.8%</text><rect x="411" y="100" width="98" height="54" fill="rgb(95,171,165)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="132" text-anchor="middle" class="plot-cell-label">97.8%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="188" text-anchor="end" >10% to 20% below</text><rect x="111" y="156" width="98" height="54" fill="rgb(131,190,185)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="188" text-anchor="middle" class="plot-cell-label">74.6%</text><rect x="211" y="156" width="98" height="54" fill="rgb(106,177,171)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="188" text-anchor="middle" class="plot-cell-label">90.6%</text><rect x="311" y="156" width="98" height="54" fill="rgb(100,174,168)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="188" text-anchor="middle" class="plot-cell-label">94.1%</text><rect x="411" y="156" width="98" height="54" fill="rgb(91,170,164)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="188" text-anchor="middle" class="plot-cell-label">100.0%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="244" text-anchor="end" >More than 20% below</text><rect x="111" y="212" width="98" height="54" fill="rgb(126,188,183)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="244" text-anchor="middle" class="plot-cell-label">77.3%</text><rect x="211" y="212" width="98" height="54" fill="rgb(101,175,169)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="244" text-anchor="middle" class="plot-cell-label">93.5%</text><rect x="311" y="212" width="98" height="54" fill="rgb(95,172,166)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="244" text-anchor="middle" class="plot-cell-label">97.4%</text><rect x="411" y="212" width="98" height="54" fill="rgb(91,170,164)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="244" text-anchor="middle" class="plot-cell-label">100.0%</text></svg>