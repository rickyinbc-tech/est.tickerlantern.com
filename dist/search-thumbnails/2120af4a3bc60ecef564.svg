<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="guardrail-matrix-title guardrail-matrix-desc"><title id="guardrail-matrix-title">How much requested spending is forgone under other cut rules?</title><desc id="guardrail-matrix-desc">Scenario matrix. Darker cells mean larger values. Scale: $0 to $172k. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="22" text-anchor="middle" >0% cut</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="22" text-anchor="middle" >5% cut</text><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="22" text-anchor="middle" >10% cut</text><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="22" text-anchor="middle" >15% cut</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >10% trigger</text><rect x="111" y="44" width="98" height="54" fill="rgb(246,249,248)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="76" text-anchor="middle" class="plot-cell-label">$0</text><rect x="211" y="44" width="98" height="54" fill="rgb(104,176,170)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="76" text-anchor="middle" class="plot-cell-label">$158k</text><rect x="311" y="44" width="98" height="54" fill="rgb(94,171,165)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="76" text-anchor="middle" class="plot-cell-label">$168k</text><rect x="411" y="44" width="98" height="54" fill="rgb(91,170,164)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="76" text-anchor="middle" class="plot-cell-label">$172k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >25% trigger</text><rect x="111" y="100" width="98" height="54" fill="rgb(246,249,248)"/><text font-family="san