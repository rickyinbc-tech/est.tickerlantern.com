nchor="start" class="plot-value">$192,056.05</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="148" text-anchor="start" >$30,000 to the spouse’s TFSA, the rest lent</text><rect x="52" y="160" width="371.40476710419193" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="193" text-anchor="start" class="plot-value">$206,335.98</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="210" text-anchor="start" >Whole amount in a TFSA (if the room existed)</text><rect x="52" y="222" width="431.38047475794446" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="255" text-anchor="start" class="plot-value">$239,655.82</text><line stroke="#91aabd" stroke-width="1" x1="52" y1="29" x2="52" y2="268"/><line stroke="#91aabd" stroke-width="1" x1="52" y1="268" x2="502" y2="268"/></svg>