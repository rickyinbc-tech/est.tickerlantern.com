ue">12.00%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="148" text-anchor="start" >$500–$999</text><rect x="52" y="160" width="78.84" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="193" text-anchor="start" class="plot-value">9.00%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="210" text-anchor="start" >$1,000–$1,999</text><rect x="52" y="222" width="96.36000000000001" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="255" text-anchor="start" class="plot-value">11.00%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="272" text-anchor="start" >$2,000–$4,999</text><rect x="52" y="284" width="105.12" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="317" text-anchor="start" class="plot-value">12.00%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="334" text-anchor="start" >$5,000 or more</text><rect x="52" y="346" width="332.88" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="379" text-anchor="start" class="plot-value">38.00%</text><line stroke="#91aabd" stroke-width="1" x1="52" y1="29" x2="52" y2="392"/><line stroke="#91aabd" stroke-width="1" x1="52" y1="392" x2="490" y2="392"/></svg>