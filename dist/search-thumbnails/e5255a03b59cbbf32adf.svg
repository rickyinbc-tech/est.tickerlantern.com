<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="phased-gap-matrix-title phased-gap-matrix-desc"><title id="phased-gap-matrix-title">Phased minus all-at-once value across return and purchase count</title><desc id="phased-gap-matrix-desc">Scenario matrix. Negative values use gold; positive values use teal. Read the signed cell labels. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="22" text-anchor="middle" >3 buys</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="22" text-anchor="middle" >6 buys</text><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="22" text-anchor="middle" >9 buys</text><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="22" text-anchor="middle" >12 buys</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >-10% return</text><rect x="111" y="44" width="98" height="54" fill="rgb(218,235,233)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="76" text-anchor="middle" class="plot-cell-label">$532.7</text><rect x="211" y="44" width="98" height="54" fill="rgb(177,213,210)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="76" text-anchor="middle" class="plot-cell-label">$1.3k</text><rect x="311" y="44" width="98" height="54" fill="rgb(134,192,187)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="76" text-anchor="middle" class="plot-cell-label">$2.2k</text><rect x="411" y="44" width="98" height="54" fill="rgb(91,170,164)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="76" text-anchor="middle" class="plot-cell-label">$3k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >0% return</text><rect x="111" y="100" width="98" height="54" fill="rgb(241,246,245)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="132" text-anchor="middle" class="plot-cell-label">$102.9</text><rect x="211" y="100" width="98" height="54" fill="rgb(233,242,241)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="132" text-anchor="middle" class="plot-cell-label">$256.8</text><rect x="311" y="100" width="98" height="54" fill="rgb(225,238,236)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="132" text-anchor="middle" class="plot-cell-label">$410.1</text><rect x="411" y="100" width="98" height="54" fill="rgb(217,234,232)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="132" text-anchor="middle" class="plot-cell-label">$563</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="188" text-anchor="end" >5% return</text><rect x="111" y="156" width="98" height="54" fill="rgb(244,245,241)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="188" text-anchor="middle" class="plot-cell-label">-$165.2</text><rect x="211" y="156" width="98" height="54" fill="rgb(240,238,230)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="188" text-anchor="middle" class="plot-cell-label">-$410.6</text><rect x="311" y="156" width="98" height="54" fill="rgb(237,232,219)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="188" text-anchor="middle" class="plot-cell-label">-$653.4</text><rect x="411" y="156" width="98" height="54" fill="rgb(234,226,209)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="188" text-anchor="middle" class="plot-cell-label">-$893.5</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="244" text-anchor="end" >10% return</text><rect x="111" y="212" width="98" height="54" fill="rgb(240,237,227)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="244" text-anchor="middle" class="plot-cell-label"