<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="bnpl-spacing-surplus-title bnpl-spacing-surplus-desc"><title id="bnpl-spacing-surplus-title">Additional starting cash across purchase spacing and weekly surplus</title><desc id="bnpl-spacing-surplus-desc">Scenario matrix. Darker cells mean larger values. Scale: $0 to $1.3k. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="22" text-anchor="middle" >$50</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="22" text-anchor="middle" >$100</text><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="22" text-anchor="middle" >$150</text><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="22" text-anchor="middle" >$200</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >0 wk gap</text><rect x="111" y="44" width="98" height="54" fill="rgb(91,170,164)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="76" text-anchor="middle" class="plot-cell-label">$1.3k</text><rect x="211" y="44" width="98" height="54" fill="rgb(122,186,180)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="76" text-anchor="middle" class="plot-cell-label">$1k</text><rect x="311" y="44" width="98" height="54" fill="rgb(153,201,197)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="76" text-anchor="middle" class="plot-cell-label">$750</text><rect x="411" y="44" width="98" height="54" fill="rgb(184,217,214)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="76" text-anchor="middle" class="plot-cell-label">$500</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >1 wk gap</text><rect x="111" y="100" width="98" height="54" fill="rgb(104,176,170)"/><text font-family