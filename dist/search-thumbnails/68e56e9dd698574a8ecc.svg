<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 592" width="520" height="592" role="img" aria-labelledby="job-loss-reconciliation-title job-loss-reconciliation-desc"><title id="job-loss-reconciliation-title">Reconcile all eighteen months of the reduced-spending scenario</title><desc id="job-loss-reconciliation-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="582" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="170.5" y1="14" x2="170.5" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="170.5" y="582" text-anchor="middle" >$50k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="14" x2="277" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="582" text-anchor="middle" >$100k</text><line stroke="#d7e0e8" stroke-width="1" x1="383.5" y1="14" x2="383.5" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="383.5" y="582" text-anchor="middle" >$150k</text><line stroke="#d7e0e8" stroke-width="1" x1="490" y1="14" x2="490" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="490" y="582" text-anchor="middle" >$200k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Starting accessible cash</text><rect x="64" y="37" width="38.34" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$18,000</text><line x1="102.34" x2="102.34" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Net settlement received once</text><rect x="102.34" y="104" width="25.560000000000002" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">+$12,000</text><line x1="127.9" x2="127.9" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Continuing income over 18 months</text><rect x="127.9" y="171" width="57.50999999999999" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">+$27,000</text><line x1="185.41" x2="185.41" y1="189" y2="238" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Temporary support actually received</text><rect x="185.41" y="238" width="23.00400000000002" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">+$10,800</text><line x1="208.41400000000002" x2="208.41400000000002" y1="256" y2="305" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="294" text-anchor="start" >New net earnings received</text><rect x="208.41400000000002" y="305" width="80.51399999999998" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="339" text-anchor="start" class="plot-value">+$37,800</text><line x1="288.928" x2="288.928" y1="323" y2="372" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="361" text-anchor="start" >Immediate transition costs</text><rect x="286.798" y="372" width="2.1299999999999955" height="18" fill="#b8822e"/><text font-family="sans-serif" font-siz