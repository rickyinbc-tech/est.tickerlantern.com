<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 324" width="520" height="324" role="img" aria-labelledby="drawdown-recovery-deposit-reconciliation-title drawdown-recovery-deposit-reconciliation-desc"><title id="drawdown-recovery-deposit-reconciliation-title">New saving can rebuild a balance without being investment earnings</title><desc id="drawdown-recovery-deposit-reconciliation-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="314" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="173" y1="14" x2="173" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="173" y="314" text-anchor="middle" >$50k</text><line stroke="#d7e0e8" stroke-width="1" x1="282" y1="14" x2="282" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="282" y="314" text-anchor="middle" >$100k</text><line stroke="#d7e0e8" stroke-width="1" x1="391" y1="14" x2="391" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="391" y="314" text-anchor="middle" >$150k</text><line stroke="#d7e0e8" stroke-width="1" x1="500" y1="14" x2="500" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="500" y="314" text-anchor="middle" >$200k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Capital remaining after the initial loss</text><rect x="64" y="37" width="152.6" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$70,000</text><line x1="216.6" x2="216.6" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >New year-end deposits</text><rect x="216.6" y="104" width="65.4" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">+$30,000</text><line x1="282" x2="282" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Subsequent investment gain or loss</text><rect x="282" y="171" width="112.82873722872694" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">+$51,756.3</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Portfolio after the final deposit</text><rect x="64" y="238" width="330.82873722872694" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">$151,756.3</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="290" x2="500" y2="290"/></svg>