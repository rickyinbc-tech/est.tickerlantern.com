" width="0" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="139" text-anchor="start" class="plot-value">$0</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="164" text-anchor="start" >Non-registered fund · the entered cost base</text><rect x="64" y="176" width="37.892700000000005" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="209" text-anchor="start" class="plot-value">$889.5</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="234" text-anchor="start" >Non-registered fund · no cost base left (all gain)</text><rect x="64" y="246" width="113.67809999999997" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="279" text-anchor="start" class="plot-value">$2,668.5</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="304" text-anchor="start" >RRSP or RRIF withdrawal (fully taxable)</text><rect x="64" y="316" width="227.35619999999994" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="349" text-anchor="start" class="plot-value">$5,337</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="372" x2="490" y2="372"/></svg>