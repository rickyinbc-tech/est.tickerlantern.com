<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 257" width="520" height="257" role="img" aria-labelledby="gift-card-cash-difference-bridge-title gift-card-cash-difference-bridge-desc"><title id="gift-card-cash-difference-bridge-title">Cash committed upfront is offset only by purchases actually replaced so far</title><desc id="gift-card-cash-difference-bridge-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="247" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="170.5" y1="14" x2="170.5" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="170.5" y="247" text-anchor="middle" >$125</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="14" x2="277" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="247" text-anchor="middle" >$250</text><line stroke="#d7e0e8" stroke-width="1" x1="383.5" y1="14" x2="383.5" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="383.5" y="247" text-anchor="middle" >$375</text><line stroke="#d7e0e8" stroke-width="1" x1="490" y1="14" x2="490" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="490" y="247" text-anchor="middle" >$500</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Card purchase paid upfront</text><rect x="64" y="37" width="383.40000000000003" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$450</text><line x1="447.40000000000003" x2="447.40000000000003" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Less purchases paid by the card</text><rect x="191.8" y="104" width="255.60000000000002" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">-$300</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Extra cash versus pay-as-you-go</text><rect x="64" y="171" width="127.80000000000001" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">$150</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="223" x2="490" y2="223"/></svg>