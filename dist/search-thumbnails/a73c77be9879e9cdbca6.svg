<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 592" width="520" height="592" role="img" aria-labelledby="rental-move-cash-bridge-title rental-move-cash-bridge-desc"><title id="rental-move-cash-bridge-title">Reconcile day-60 cash without spending a pending refund</title><desc id="rental-move-cash-bridge-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="582" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="170.5" y1="14" x2="170.5" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="170.5" y="582" text-anchor="middle" >$5k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="14" x2="277" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="582" text-anchor="middle" >$10k</text><line stroke="#d7e0e8" stroke-width="1" x1="383.5" y1="14" x2="383.5" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="383.5" y="582" text-anchor="middle" >$15k</text><line stroke="#d7e0e8" stroke-width="1" x1="490" y1="14" x2="490" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="490" y="582" text-anchor="middle" >$20k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Cash allocated before day 1</text><rect x="64" y="37" width="85.19999999999999" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$4,000</text><line x1="149.2" x2="149.2" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Four net pay deposits</text><rect x="149.2" y="104" width="170.40000000000003" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">+$8,000</text><line x1="319.6" x2="319.6" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Old deposit refund received</text><rect x="319.6" y="171" width="19.16999999999996" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">+$900</text><line x1="338.77" x2="338.77" y1="189" y2="238" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Old and new rent paid</text><rect x="215.23" y="238" width="123.53999999999999" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">-$5,800</text><line x1="215.23" x2="215.23" y1="256" y2="305" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="294" text-anchor="start" >New deposit cash paid</text><rect x="193.93" y="305" width="21.299999999999983" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="339" text-anchor="start" class="plot-value">-$1,000</text><line x1="193.93" x2="193.93" y1="323" y2="372" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="361" text-anchor="start" >Moving cost paid</text><rect x="181.15" y="372" width="12.780000000000001" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="406" text-anchor="start" class="plot-value">-$600</