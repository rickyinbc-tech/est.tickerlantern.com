<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" width="520" height="270" role="img" aria-labelledby="labour-budget-population-title labour-budget-population-desc"><title id="labour-budget-population-title">Choose the denominator after identifying the population groups</title><desc id="labour-budget-population-desc">Donut chart of the selected 2025 Canada LFS population estimate in persons in thousands: employed, unemployed and not in the labour force. The legend percentages use the whole illustrated population as denominator, not only the labour force. Exact values are available in the chart data table below.</desc><circle cx="260" cy="130" r="86" fill="none" stroke="#e3ebed" stroke-width="34"/><circle cx="260" cy="130" r="86" fill="none" stroke="#087f76" stroke-width="34" pathLength="100" stroke-dasharray="60.83038756819615 39.16961243180385" stroke-dashoffset="0" transform="rotate(-90 260 130)"/><circle cx="260" cy="130" r="86" fill="none" stroke="#102f50" stroke-width="34" pathLength="100" stroke-dasharray="4.451624847408402 95.5483751525916" stroke-dashoffset="-60.83038756819615" transform="rotate(-90 260 130)"/><circle cx="260" cy="130" r="86" fill="none" stroke="#b8822e" stroke-width="34" pathLength="100" stroke-dasharray="34.717987584395445 65.28201241560456" stroke-dashoffset="-65.28201241560456" transform="rotate(-90 260 130)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="123" text-anchor="middle" class="plot-donut-total">34569.4</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="150" text-anchor="middle" >LFS population</text></svg>