<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 391" width="520" height="391" role="img" aria-labelledby="construction-cash-commitments-title construction-cash-commitments-desc"><title id="construction-cash-commitments-title">A quote below available cash can still leave the complete plan short</title><desc id="construction-cash-commitments-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="357"/><line stroke="#d7e0e8" stroke-width="1" x1="173" y1="14" x2="173" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="173" y="381" text-anchor="middle" >$23.1k</text><line stroke="#d7e0e8" stroke-width="1" x1="282" y1="14" x2="282" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="282" y="381" text-anchor="middle" >$48.8k</text><line stroke="#d7e0e8" stroke-width="1" x1="391" y1="14" x2="391" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="391" y="381" text-anchor="middle" >$74.4k</text><line stroke="#d7e0e8" stroke-width="1" x1="500" y1="14" x2="500" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="500" y="381" text-anchor="middle" >$100k</text><line stroke="#d7e0e8" stroke-width="1" x1="74.63414634146342" y1="14" x2="74.63414634146342" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="74.63414634146342" y="381" text-anchor="middle" >$0</text><line stroke="#91aabd" stroke-width="1" x1="74.63414634146342" y1="14" x2="74.63414634146342" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Cash assigned to this project</text><rect x="74.63414634146342" y="37" width="425.3658536585366" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$100,000</text><line x1="500" x2="500" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Current contract quote</text><rect x="123.55121951219513" y="104" width="376.44878048780487" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">-$88,500</text><line x1="123.55121951219513" x2="123.55121951219513" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Known costs outside the quote</text><rect x="102.28292682926829" y="171" width="21.26829268292684" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">-$5,000</text><line x1="102.28292682926829" x2="102.28292682926829" y1="189" y2="238" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Additional contingency earmark</text><rect x="64.63804878048781" y="238" width="37.644878048780484" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">-$8,850</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="294" text-anchor="start" >Unassigned cash / funding shortfall</text><rect x="64.63804878048781" y="305" width="9.996097560975613" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="339" text-anchor="start" class="plot-value">-$2,350</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="357" x2="500" y2="357"/></svg>