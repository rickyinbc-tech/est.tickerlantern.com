<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 264" width="520" height="264" role="img" aria-labelledby="tail-measures-three-summaries-title tail-measures-three-summaries-desc"><title id="tail-measures-three-summaries-title">A loss quantile, a tail average and the largest modeled loss answer different questions</title><desc id="tail-measures-three-summaries-desc">Horizontal signed bars around an explicit zero axis. Negative values extend left of zero, and positive values extend right. Signs and exact values are included in labels and the data table. Exact values are available in the chart data table below.</desc><line stroke="#91aabd" stroke-width="1" x1="64" y1="30" x2="64" y2="232"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="254" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="170.5" y1="30" x2="170.5" y2="232"/><text font-family="sans-serif" font-size="10" fill="#556779" x="170.5" y="254" text-anchor="middle" >$12.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="30" x2="277" y2="232"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="254" text-anchor="middle" >$25k</text><line stroke="#d7e0e8" stroke-width="1" x1="383.5" y1="30" x2="383.5" y2="232"/><text font-family="sans-serif" font-size="10" fill="#556779" x="383.5" y="254" text-anchor="middle" >$37.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="490" y1="30" x2="490" y2="232"/><text font-family="sans-serif" font-size="10" fill="#556779" x="490" y="254" text-anchor="middle" >$50k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="24" text-anchor="start" >VaR: selected loss quantile</text><rect x="64" y="36" width="42.599999999999994" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="69" text-anchor="start" class="plot-value">$5,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="94" text-anchor="start" >E