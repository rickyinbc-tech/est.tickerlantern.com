<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 458" width="520" height="458" role="img" aria-labelledby="replacement-ratio-current-bridge-title replacement-ratio-current-bridge-desc"><title id="replacement-ratio-current-bridge-title">Reconcile gross pay with the current cash needs that continue into retirement</title><desc id="replacement-ratio-current-bridge-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="448" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="173" y1="14" x2="173" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="173" y="448" text-anchor="middle" >$25k</text><line stroke="#d7e0e8" stroke-width="1" x1="282" y1="14" x2="282" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="282" y="448" text-anchor="middle" >$50k</text><line stroke="#d7e0e8" stroke-width="1" x1="391" y1="14" x2="391" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="391" y="448" text-anchor="middle" >$75k</text><line stroke="#d7e0e8" stroke-width="1" x1="500" y1="14" x2="500" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="500" y="448" text-anchor="middle" >$100k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Current gross employment pay</text><rect x="64" y="37" width="436" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$100,000</text><line x1="500" x2="500" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Tax and other pay deductions</text><rect x="391" y="104" width="109" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">-$25,000</text><line x1="391" x2="391" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Saving from take-home cash</text><rect x="325.59999999999997" y="171" width="65.40000000000003" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">-$15,000</text><line x1="325.59999999999997" x2="325.59999999999997" y1="189" y2="238" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Work costs assumed to end</text><rect x="303.8" y="238" width="21.799999999999955" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">-$5,000</text><line x1="303.8" x2="303.8" y1="256" y2="305" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="294" text-anchor="start" >Debt payments assumed to end</text><rect x="260.20000000000005" y="305" width="43.599999999999966" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="339" text-anchor="start" class="plot-value">-$10,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="361" text-anchor="start" >Continuing annual cash needs</text><rect x="64" y="372" width="196.20000000000005" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="406" text-anchor="start" class="plot-value">$45,000<