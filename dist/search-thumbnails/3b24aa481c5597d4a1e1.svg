xt font-family="sans-serif" font-size="10" fill="#556779" x="52" y="148" text-anchor="start" >Entered 24-month obligations</text><rect x="52" y="160" width="208.8" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="193" text-anchor="start" class="plot-value">$116,000</text><line stroke="#91aabd" stroke-width="1" x1="52" y1="29" x2="52" y2="206"/><line stroke="#91aabd" stroke-width="1" x1="52" y1="206" x2="502" y2="206"/></svg>