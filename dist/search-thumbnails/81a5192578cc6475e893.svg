<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="share-vesting-gradual-matrix-title share-vesting-gradual-matrix-desc"><title id="share-vesting-gradual-matrix-title">Unvested gross value changes with the date and the gradual vesting period</title><desc id="share-vesting-gradual-matrix-desc">Scenario matrix. Darker cells mean larger values. Scale: $0 to $25.7k. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="22" text-anchor="middle" >2 yr</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="22" text-anchor="middle" >3 yr</text><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="22" text-anchor="middle" >5 yr</text><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="22" text-anchor="middle" >7 yr</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >Year 1</text><rect x="111" y="44" width="98" height="54" fill="rgb(156,203,199)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="76" text-anchor="middle" class="plot-cell-label">$15k</text><rect x="211" y="44" width="98" height="54" fill="rgb(126,187,182)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="76" text-anchor="middle" class="plot-cell-label">$20k</text><rect x="311" y="44" width="98" height="54" fill="rgb(102,175,169)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="76" text-anchor="middle" class="plot-cell-label">$24k</text><rect x="411" y="44" width="98" height="54" fill="rgb(91,170,164)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="76" text-anchor="middle" class="plot-cell-label">$25.7k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >Year 2</text><rect x="111" y="100" width="98" height="54" fill