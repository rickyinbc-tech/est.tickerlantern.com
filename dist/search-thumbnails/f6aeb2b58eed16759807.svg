<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" width="520" height="270" role="img" aria-labelledby="day-basis-calendar-split-title day-basis-calendar-split-desc"><title id="day-basis-calendar-split-title">Split accrued days by calendar year before applying a year-specific denominator</title><desc id="day-basis-calendar-split-desc">Donut chart partitions the actual accrued calendar days by their calendar year. Every included date belongs to exactly one year, and all shares sum to 100 percent. The listed denominators apply only to the explicitly authored calendar-year example. Exact values are available in the chart data table below.</desc><circle cx="260" cy="130" r="86" fill="none" stroke="#e3ebed" stroke-width="34"/><circle cx="260" cy="130" r="86" fill="none" stroke="#087f76" stroke-width="34" pathLength="100" stroke-dasharray="18.681318681318682 81.31868131868131" stroke-dashoffset="0" transform="rotate(-90 260 130)"/><circle cx="260" cy="130" r="86" fill="none" stroke="#102f50" stroke-width="34" pathLength="100" stroke-dasharray="81.31868131868131 18.681318681318686" stroke-dashoffset="-18.681318681318682" transform="rotate(-90 260 130)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="123" text-anchor="middle" class="plot-donut-total">91</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="150" text-anchor="middle" >Accrued days</text></svg>