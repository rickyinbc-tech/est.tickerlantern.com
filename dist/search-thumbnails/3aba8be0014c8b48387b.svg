<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 391" width="520" height="391" role="img" aria-labelledby="household-debt-personal-cash-title household-debt-personal-cash-desc"><title id="household-debt-personal-cash-title">The monthly cash plan measures a different burden</title><desc id="household-debt-personal-cash-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="381" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="170.5" y1="14" x2="170.5" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="170.5" y="381" text-anchor="middle" >$2.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="14" x2="277" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="381" text-anchor="middle" >$5k</text><line stroke="#d7e0e8" stroke-width="1" x1="383.5" y1="14" x2="383.5" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="383.5" y="381" text-anchor="middle" >$7.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="490" y1="14" x2="490" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="490" y="381" text-anchor="middle" >$10k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Net cash income received</text><rect x="64" y="37" width="340.8" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$8,000</text><line x1="404.8" x2="404.8" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Scheduled principal and interest</text><rect x="285.52" y="104" width="119.28000000000003" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">-$2,800</text><line x1="285.52" x2="285.52" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Living costs excluding these items</text><rect x="115.12" y="171" width="170.39999999999998" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">-$4,000</text><line x1="115.12" x2="115.12" y1="189" y2="238" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Reserve for listed annual bills</text><rect x="102.34" y="238" width="12.780000000000001" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">-$300</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="294" text-anchor="start" >Cash left, or unfunded gap</text><rect x="64" y="305" width="38.34" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="339" text-anchor="start" class="plot-value">$900</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="357" x2="490" y2="357"/></svg>