<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 257" width="520" height="257" role="img" aria-labelledby="oas-annual-bridge-title oas-annual-bridge-desc"><title id="oas-annual-bridge-title">Separate 2025 OAS from its simplified recovery</title><desc id="oas-annual-bridge-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="247" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="173" y1="14" x2="173" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="173" y="247" text-anchor="middle" >$2.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="282" y1="14" x2="282" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="282" y="247" text-anchor="middle" >$5k</text><line stroke="#d7e0e8" stroke-width="1" x1="391" y1="14" x2="391" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="391" y="247" text-anchor="middle" >$7.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="500" y1="14" x2="500" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="500" y="247" text-anchor="middle" >$10k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Gross OAS received in 2025</text><rect x="64" y="37" width="392.40000000000003" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$9,000</text><line x1="456.40000000000003" x2="456.40000000000003" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Simplified 2025 recovery</text><rect x="413.58916" y="104" width="42.81084000000004" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">-$981.9</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >OAS after recovery only</text><rect x="64" y="171" width="349.58916" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">$8,018.1</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="223" x2="500" y2="223"/></svg>