<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 424" width="520" height="424" role="img" aria-labelledby="pension-split-income-markers-title pension-split-income-markers-desc"><title id="pension-split-income-markers-title">Official 2026 net-income markers where splitting can change credits or clawbacks</title><desc id="pension-split-income-markers-desc">Horizontal bar chart. CAD; value axis starts at zero. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="52" y1="29" x2="52" y2="392"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="414" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="164.5" y1="29" x2="164.5" y2="392"/><text font-family="sans-serif" font-size="10" fill="#556779" x="164.5" y="414" text-anchor="middle" >$50k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="29" x2="277" y2="392"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="414" text-anchor="middle" >$100k</text><line stroke="#d7e0e8" stroke-width="1" x1="389.5" y1="29" x2="389.5" y2="392"/><text font-family="sans-serif" font-size="10" fill="#556779" x="389.5" y="414" text-anchor="middle" >$150k</text><line stroke="#d7e0e8" stroke-width="1" x1="502" y1="29" x2="502" y2="392"/><text font-family="sans-serif" font-size="10" fill="#556779" x="502" y="414" text-anchor="middle" >$200k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="24" text-anchor="start" >Age amount starts to shrink</text><rect x="52" y="36" width="104.47200000000001" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="69" text-anchor="start" class="plot-value">$46,432</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="86" text-anchor="start" >First federal bracket ends</text><rect x="52" y="98" width="131.67675" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="131" text-anchor="start" class="plot-value">$58,523</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="148" text-anchor="start" >OAS recovery starts (2026 income)</text><rect x="52" y="160" width="214.47675000000004" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="193" text-anchor="start" class="plot-value">$95,323</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="210" text-anchor="start" >Age amount fully eliminated</text><rect x="52" y="222" width="242.59275000000002" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="255" text-anchor="start" class="plot-value">$107,819</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="272" text-anchor="start" >Second federal bracket ends</text><rect x="52" y="284" width="263.35125" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="317" text-anchor="start" class="plot-value">$117,045</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="334" text-anchor="start" >Basic personal amount starts to shrink</text><rect x="52" y="346" width="408.24" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="379" text-anchor="start" class="plot-value">$181,440</text><line stroke="#91aabd" stroke-width="1" x1="52" y1="29" x2="52" y2="392"/><line stroke="#91aabd" stroke-width="1" x1="52" y1="392" x2="502" y2="392"/></svg>