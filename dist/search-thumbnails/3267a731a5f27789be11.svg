<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 544" width="520" height="544" role="img" aria-labelledby="tfsa-calendar-title tfsa-calendar-desc"><title id="tfsa-calendar-title">Account value and available room follow different ledgers</title><desc id="tfsa-calendar-desc">Horizontal grouped bar chart. CAD; value axis starts at zero. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="52" y1="29" x2="52" y2="512"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="534" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="164.5" y1="29" x2="164.5" y2="512"/><text font-family="sans-serif" font-size="10" fill="#556779" x="164.5" y="534" text-anchor="middle" >$25k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="29" x2="277" y2="512"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="534" text-anchor="middle" >$50k</text><line stroke="#d7e0e8" stroke-width="1" x1="389.5" y1="29" x2="389.5" y2="512"/><text font-family="sans-serif" font-size="10" fill="#556779" x="389.5" y="534" text-anchor="middle" >$75k</text><line stroke="#d7e0e8" stroke-width="1" x1="502" y1="29" x2="502" y2="512"/><text font-family="sans-serif" font-size="10" fill="#556779" x="502" y="534" text-anchor="middle" >$100k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="24" text-anchor="start" >Start of year 1</text><rect x="52" y="34" width="180" height="13" fill="#087f76"/><rect x="52" y="54" width="31.5" height="13" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="89" text-anchor="start" class="plot-value">$40,000 / $7,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="106" text-anchor="start" >After first contribution</text><rect x="52" y="116" width="202.5" height="13" fill="#087f76"/><rect x="52" y="136" width="9" height="13" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="171" text-anchor="start" class="plot-value">$45,000 / $2,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="188" text-anchor="start" >After ordinary withdrawal</text><rect x="52" y="198" width="157.5" height="13" fill="#087f76"/><rect x="52" y="218" width="9" height="13" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="253" text-anchor="start" class="plot-value">$35,000 / $2,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="270" text-anchor="start" >After later contribution</text><rect x="52" y="280" width="166.5" height="13" fill="#087f76"/><rect x="52" y="300" width="0" height="13" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="335" text-anchor="start" class="plot-value">$37,000 / $0</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="352" text-anchor="start" >Start of year 2</text><rect x="52" y="362" width="166.5" height="13" fill="#087f76"/><rect x="52" y="382" width="76.5" height="13" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="417" text-anchor="start" class="plot-value">$37,000 / $17,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="434" text-anchor="start" >After year 2 contribution</text><rect x="52" y="444" width="234" height="13" fill="#087f76"/><rect x="52" y="464" width="9" height="13" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="499" text-anchor="start" class="plot-value">$52,000 / $2,000</text><line stroke="#91aabd" stroke-width="1" x1="52" y1="29" x2="52" y2="512"/><line stroke="#91aabd" stroke-width="1" x1="52" y1="512" x2="502" y2="512"/></svg>