nt-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Stocks fall 12%</text><rect x="459.32800000000003" y="104" width="30.67199999999997" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">-$7,200</text><line x1="459.32800000000003" x2="459.32800000000003" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Bond income at 1.5%</text><rect x="459.32800000000003" y="171" width="2.555999999999983" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">+$600</text><line x1="461.884" x2="461.884" y1="189" y2="238" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Bond prices fall as yields rise</text><rect x="438.028" y="238" width="23.855999999999995" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">-$5,600</text><line x1="438.028" x2="438.028" y1="256" y2="305" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="294" text-anchor="start" >Purchasing power lost to 6.3% inflation</text><rect x="415.86077140169334" y="305" width="22.16722859830668" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="339" text-anchor="start" class="plot-value">-$5,203.57</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="361" text-anchor="start" >Year-end value in start-of-year dollars</text><rect x="64" y="372" width="351.86077140169334" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="406" text-anchor="start" class="p