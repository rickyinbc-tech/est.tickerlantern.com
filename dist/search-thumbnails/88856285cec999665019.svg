<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="mortgage-matrix-title mortgage-matrix-desc"><title id="mortgage-matrix-title">Rate and amortization change the payment</title><desc id="mortgage-matrix-desc">Scenario matrix. Darker cells mean larger values. Scale: $0 to $4.4k. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="22" text-anchor="middle" >10 years</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="22" text-anchor="middle" >15 years</text><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="22" text-anchor="middle" >20 years</text><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="22" text-anchor="middle" >25 years</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >3% rate</text><rect x="111" y="44" width="98" height="54" fill="rgb(111,180,174)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="76" text-anchor="middle" class="plot-cell-label">$3.9k</text><rect x="211" y="44" width="98" height="54" fill="rgb(150,200,195)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="76" text-anchor="middle" class="plot-cell-label">$2.8k</text><rect x="311" y="44" width="98" height="54" fill="rgb(169,209,206)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="76" text-anchor="middle" class="plot-cell-label">$2.2k</text><rect x="411" y="44" width="98" height="54" fill="rgb(180,215,212)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="76" text-anchor="middle" class="plot-cell-label">$1.9k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >4% rate</text><rect x="111" y="100" width="98" height="54" fill="rgb(105,177,171)"/><text font-family="sans-serif" font-size="10