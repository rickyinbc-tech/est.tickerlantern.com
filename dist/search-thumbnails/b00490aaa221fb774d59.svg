<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 324" width="520" height="324" role="img" aria-labelledby="indexed-bond-cash-reconciliation-title indexed-bond-cash-reconciliation-desc"><title id="indexed-bond-cash-reconciliation-title">Reconcile every received dollar with the original purchase outlay</title><desc id="indexed-bond-cash-reconciliation-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="314" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="170.5" y1="14" x2="170.5" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="170.5" y="314" text-anchor="middle" >$5k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="14" x2="277" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="314" text-anchor="middle" >$10k</text><line stroke="#d7e0e8" stroke-width="1" x1="383.5" y1="14" x2="383.5" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="383.5" y="314" text-anchor="middle" >$15k</text><line stroke="#d7e0e8" stroke-width="1" x1="490" y1="14" x2="490" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="490" y="314" text-anchor="middle" >$20k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >All coupon cash, retained without interest</text><rect x="64" y="37" width="23.1245457488871" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$1,085.66</text><line x1="87.1245457488871" x2="87.1245457488871" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Principal repaid at maturity</text><rect x="87.1245457488871" y="104" width="246.9253778259" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">+$11,592.74</text><line x1="334.0499235747871" x2="334.0499235747871" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Original purchase outlay</text><rect x="110.39992357478712" y="171" width="223.64999999999998" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">-$10,500</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Net nominal cash over the full holding period</text><rect x="64" y="238" width="46.399923574787124" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">$2,178.4</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="290" x2="490" y2="290"/></svg>