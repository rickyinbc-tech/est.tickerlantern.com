<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 324" width="520" height="324" role="img" aria-labelledby="fx-cost-dated-cad-record-title fx-cost-dated-cad-record-desc"><title id="fx-cost-dated-cad-record-title">Translate each dated amount before reconciling the result</title><desc id="fx-cost-dated-cad-record-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="314" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="170.5" y1="14" x2="170.5" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="170.5" y="314" text-anchor="middle" >$5k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="14" x2="277" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="314" text-anchor="middle" >$10k</text><line stroke="#d7e0e8" stroke-width="1" x1="383.5" y1="14" x2="383.5" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="383.5" y="314" text-anchor="middle" >$15k</text><line stroke="#d7e0e8" stroke-width="1" x1="490" y1="14" x2="490" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="490" y="314" text-anchor="middle" >$20k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >USD proceeds at sale-date rate</text><rect x="64" y="37" width="345.06" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$16,200</text><line x1="409.06" x2="409.06" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Cost at acquisition-date rate</text><rect x="142.81000000000003" y="104" width="266.25" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">-$12,500</text><line x1="142.81000000000003" x2="142.81000000000003" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Disposition expenses in CAD</text><rect x="141.74500000000003" y="171" width="1.0649999999999977" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">-$50</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >CAD arithmetic gain or loss</text><rect x="64" y="238" width="77.74500000000003" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">$3,650</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="290" x2="490" y2="290"/></svg>