<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 324" width="520" height="324" role="img" aria-labelledby="training-investment-cost-title training-investment-cost-desc"><title id="training-investment-cost-title">The investment includes income you give up</title><desc id="training-investment-cost-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="314" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="170.5" y1="14" x2="170.5" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="170.5" y="314" text-anchor="middle" >$12.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="14" x2="277" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="314" text-anchor="middle" >$25k</text><line stroke="#d7e0e8" stroke-width="1" x1="383.5" y1="14" x2="383.5" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="383.5" y="314" text-anchor="middle" >$37.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="490" y1="14" x2="490" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="490" y="314" text-anchor="middle" >$50k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Course, equipment and other upfront costs</text><rect x="64" y="37" width="102.24000000000001" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$12,000</text><line x1="166.24" x2="166.24" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Foregone take-home income while studying</text><rect x="166.24" y="104" width="102.24000000000001" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">+$12,000</text><line x1="268.48" x2="268.48" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Foregone take-home income while searching</text><rect x="268.48" y="171" width="51.120000000000005" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">+$6,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Total incremental cost before the new job</text><rect x="64" y="238" width="255.60000000000002" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">$30,000</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="290" x2="490" y2="290"/></svg>