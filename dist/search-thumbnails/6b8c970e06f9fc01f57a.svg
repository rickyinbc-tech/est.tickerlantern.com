<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 238" width="520" height="238" role="img" aria-labelledby="warranty-event-probabilities-title warranty-event-probabilities-desc"><title id="warranty-event-probabilities-title">A failure probability is not the same as a payable-claim probability</title><desc id="warranty-event-probabilities-desc">Horizontal bar chart. Value axis starts at zero. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="52" y1="29" x2="52" y2="206"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="228" text-anchor="middle" >0.0%</text><line stroke="#d7e0e8" stroke-width="1" x1="161.5" y1="29" x2="161.5" y2="206"/><text font-family="sans-serif" font-size="10" fill="#556779" x="161.5" y="228" text-anchor="middle" >25.0%</text><line stroke="#d7e0e8" stroke-width="1" x1="271" y1="29" x2="271" y2="206"/><text font-family="sans-serif" font-size="10" fill="#556779" x="271" y="228" text-anchor="middle" >50.0%</text><line stroke="#d7e0e8" stroke-width="1" x1="380.5" y1="29" x2="380.5" y2="206"/><text font-family="sans-serif" font-size="10" fill="#556779" x="380.5" y="228" text-anchor="middle" >75.0%</text><line stroke="#d7e0e8" stroke-width="1" x1="490" y1="29" x2="490" y2="206"/><text font-family="sans-serif" font-size="10" fill="#556779" x="490" y="228" text-anchor="middle" >100.0%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="24" text-anchor="start" >No modeled repair</text><rect x="52" y="36" width="262.8" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="69" text-anchor="start" class="plot-value">60.00%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="86" text-anchor="start" >Eligible repair event</text><rect x="52" y="98" width="122.63999999999999" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="131" text-anchor="start" class="plot-value">28.00%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="148" text-anchor="start" >Excluded repair event</text><rect x="52" y="160" width="52.56" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="193" text-anchor="start" class="plot-value">12.00%</text><line stroke="#91aabd" stroke-width="1" x1="52" y1="29" x2="52" y2="206"/><line stroke="#91aabd" stroke-width="1" x1="52" y1="206" x2="490" y2="206"/></svg>