<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 362" width="520" height="362" role="img" aria-labelledby="home-remaining-title home-remaining-desc"><title id="home-remaining-title">What the remaining cash requirement needs to cover</title><desc id="home-remaining-desc">Horizontal bar chart. CAD; value axis starts at zero. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="52" y1="29" x2="52" y2="330"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="352" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="164.5" y1="29" x2="164.5" y2="330"/><text font-family="sans-serif" font-size="10" fill="#556779" x="164.5" y="352" text-anchor="middle" >$12.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="29" x2="277" y2="330"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="352" text-anchor="middle" >$25k</text><line stroke="#d7e0e8" stroke-width="1" x1="389.5" y1="29" x2="389.5" y2="330"/><text font-family="sans-serif" font-size="10" fill="#556779" x="389.5" y="352" text-anchor="middle" >$37.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="502" y1="29" x2="502" y2="330"/><text font-family="sans-serif" font-size="10" fill="#556779" x="502" y="352" text-anchor="middle" >$50k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="24" text-anchor="start" >Down payment still due</text><rect x="52" y="36" width="450" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="69" text-anchor="start" class="plot-value">$50,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="86" text-anchor="start" >Closing-cost allowance</text><rect x="52" y="98" width="189" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="131" text-anchor="start" class="plot-value">$21,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="148" text-anchor="start" >Additional fixed closing costs</text><rect x="52" y="160" width="18" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="193" text-anchor="start" class="plot-value">$2,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="210" text-anchor="start" >Moving and setup</text><rect x="52" y="222" width="45" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="255" text-anchor="start" class="plot-value">$5,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="272" text-anchor="start" >Retained cash reserve</text><rect x="52" y="284" width="90" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="317" text-anchor="start" class="plot-value">$10,000</text><line stroke="#91aabd" stroke-width="1" x1="52" y1="29" x2="52" y2="330"/><line stroke="#91aabd" stroke-width="1" x1="52" y1="330" x2="502" y2="330"/></svg>