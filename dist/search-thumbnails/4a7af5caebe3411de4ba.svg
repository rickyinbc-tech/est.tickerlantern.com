<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 257" width="520" height="257" role="img" aria-labelledby="uk-pension-relief-at-source-bridge-title uk-pension-relief-at-source-bridge-desc"><title id="uk-pension-relief-at-source-bridge-title">Relief at source builds the gross contribution from a net payment and government money</title><desc id="uk-pension-relief-at-source-bridge-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="247" text-anchor="middle" >£0</text><line stroke="#d7e0e8" stroke-width="1" x1="170.5" y1="14" x2="170.5" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="170.5" y="247" text-anchor="middle" >£500</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="14" x2="277" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="247" text-anchor="middle" >£1k</text><line stroke="#d7e0e8" stroke-width="1" x1="383.5" y1="14" x2="383.5" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="383.5" y="247" text-anchor="middle" >£1.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="490" y1="14" x2="490" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="490" y="247" text-anchor="middle" >£2k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Employee pays from take-home pay</text><rect x="64" y="37" width="245.03520000000003" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+£1,150.4</text><line x1="309.0