<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 525" width="520" height="525" role="img" aria-labelledby="rental-cash-bridge-title rental-cash-bridge-desc"><title id="rental-cash-bridge-title">Follow collected rent through every entered cash use</title><desc id="rental-cash-bridge-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="515" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="173" y1="14" x2="173" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="173" y="515" text-anchor="middle" >$12.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="282" y1="14" x2="282" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="282" y="515" text-anchor="middle" >$25k</text><line stroke="#d7e0e8" stroke-width="1" x1="391" y1="14" x2="391" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="391" y="515" text-anchor="middle" >$37.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="500" y1="14" x2="500" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="500" y="515" text-anchor="middle" >$50k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Rent collected</text><rect x="64" y="37" width="306.94399999999996" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$35,200</text><line x1="370.94399999999996" x2="370.94399999999996" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Twelve months of operating cash costs</text><rect x="308.16" y="104" width="62.783999999999935" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">-$7,200</text><line x1="308.16" x2="308.16" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Annual loan interest paid</text><rect x="220.96" y="171" width="87.20000000000002" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">-$10,000</text><line x1="220.96" x2="220.96" y1="189" y2="238" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Annual loan principal repaid</text><rect x="151.2" y="238" width="69.76000000000002" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">-$8,000</text><line x1="151.2" x2="151.2" y1="256" y2="305" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="294" text-anchor="start" >Separate capital-project payment</text><rect x="107.6" y="305" width="43.599999999999994" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="339" text-anchor="start" class="plot-value">-$5,000</text><line x1="107.6" x2="107.6" y1="323" y2="372" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="361" text-anchor="start" >Independent tax cash allowance</text><rect x="81.44" y="372" width="26.159999999999997" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="406" text-anchor="start" class="plot-value">-$3,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="428" text-anchor="start" >Annual cash retained, or owner funding needed</text><rect x="64" y="439" width="17.439999999999998" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="473" text-anchor="start" class="plot-value">$2,000</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="491" x2="500" y2="491"/></svg>