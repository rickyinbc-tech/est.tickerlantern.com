<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 525" width="520" height="525" role="img" aria-labelledby="dtc-transfer-waterfall-title dtc-transfer-waterfall-desc"><title id="dtc-transfer-waterfall-title">From the dependant’s disability amount to the supporter’s credit</title><desc id="dtc-transfer-waterfall-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="515" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="170.5" y1="14" x2="170.5" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="170.5" y="515" text-anchor="middle" >$5k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="14" x2="277" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="515" text-anchor="middle" >$10k</text><line stroke="#d7e0e8" stroke-width="1" x1="383.5" y1="14" x2="383.5" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="383.5" y="515" text-anchor="middle" >$15k</text><line stroke="#d7e0e8" stroke-width="1" x1="490" y1="14" x2="490" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="490" y="515" text-anchor="middle" >$20k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="491"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Dependant’s disability amount</text><rect x="64" y="37" width="220.26330000000002" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$10,341</text><line x1="284.2633" x2="284.2633" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Less the part the dependant needs</text><rect x="176.99969499999997" y="104" width="107.26360500000004" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">-$5,035.85</text><line x1="176.99969499999997" x2="176.99969499999997" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Plus Canada caregiver amount</text><rect x="176.99969499999997" y="171" width="114.46620000000001" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">+$5,374</text><line x1="291.465895" x2="291.465895" y1="189" y2="238" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Less the share claimed by another supporter</text><rect x="291.465895" y="238" width="0" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">$0</text><line x1="291.465895" x2="291.465895" y1="256" y2="305" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="294" text-anchor="start" >Less the 86% that is not credited</text><rect x="95.845204" y="305" width="195.620691" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="339" text-anchor="start" class="plot-value">-$9,184.07</text><line x1="95.845204" x2="95.845204" y1="323" y2="372" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="361" text-anchor="start" >Less credit with no tax to absorb it</text><rect x="95.845204" y="372" width="0" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="406" text-anchor="start" class="plot-value">$0</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="428" text-anchor="start" >Supporter’s federal credit</text><rect x="64" y="439" width="31.845203999999995" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="473" text-anchor="start" class="plot-value">$1,495.08</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="491" x2="490" y2="491"/></svg>