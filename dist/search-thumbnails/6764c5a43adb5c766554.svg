<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 391" width="520" height="391" role="img" aria-labelledby="diy-cash-saving-title diy-cash-saving-desc"><title id="diy-cash-saving-title">Reconcile the cash consequences before pricing personal time</title><desc id="diy-cash-saving-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="381" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="173" y1="14" x2="173" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="173" y="381" text-anchor="middle" >$1.3k</text><line stroke="#d7e0e8" stroke-width="1" x1="282" y1="14" x2="282" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="282" y="381" text-anchor="middle" >$2.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="391" y1="14" x2="391" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="391" y="381" text-anchor="middle" >$3.8k</text><line stroke="#d7e0e8" stroke-width="1" x1="500" y1="14" x2="500" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="500" y="381" text-anchor="middle" >$5k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >All-in hired price avoided</text><rect x="64" y="37" width="261.59999999999997" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$3,000</text><line x1="325.59999999999997" x2="325.59999999999997" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >DIY materials and consumables</text><rect x="220.96" y="104" width="104.63999999999996" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">-$1,200</text><line x1="220.96" x2="220.96" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >New tools and upfront costs</text><rect x="194.79999999999998" y="171" width="26.160000000000025" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">-$300</text><line x1="194.79999999999998" x2="194.79999999999998" y1="189" y2="238" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >After-tax earnings actually forgone</text><rect x="142.48000000000002" y="238" width="52.319999999999965" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">-$600</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="294" text-anchor="start" >DIY cash-resource saving</text><rect x="64" y="305" width="78.48000000000002" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="339" text-anchor="start" class="plot-value">$900</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="357" x2="500" y2="357"/></svg>