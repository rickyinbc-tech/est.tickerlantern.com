<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="inflation-real-title inflation-real-desc"><title id="inflation-real-title">Nominal returns translated into real returns</title><desc id="inflation-real-desc">Scenario matrix. Negative values use gold; positive values use teal. Read the signed cell labels. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="22" text-anchor="middle" >2%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="22" text-anchor="middle" >4%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="22" text-anchor="middle" >6%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="22" text-anchor="middle" >8%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >1% inflation</text><rect x="111" y="44" width="98" height="54" fill="rgb(224,238,236)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="76" text-anchor="middle" class="plot-cell-label">1.0%</text><rect x="211" y="44" width="98" height="54" fill="rgb(180,215,212)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="76" text-anchor="middle" class="plot-cell-label">3.0%</text><rect x="311" y="44" width="98" height="54" fill="rgb(136,192,188)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="76" text-anchor="middle" class="plot-cell-label">5.0%</text><rect x="411" y="44" width="98" height="54" fill="rgb(91,170,164)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="76" text-anchor="middle" class="plot-cell-label">6.9%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >2% inflation</text><rect x="111" y="100" width="98" height="54" fill="rgb(246,249,248)"/><text font-family="sans-serif" font