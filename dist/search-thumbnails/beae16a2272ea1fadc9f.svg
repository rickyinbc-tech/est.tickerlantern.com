<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 458" width="520" height="458" role="img" aria-labelledby="lease-buy-ledger-title lease-buy-ledger-desc"><title id="lease-buy-ledger-title">Buying and selling requires both the asset and loan payoff</title><desc id="lease-buy-ledger-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="448" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="170.5" y1="14" x2="170.5" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="170.5" y="448" text-anchor="middle" >$25k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="14" x2="277" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="448" text-anchor="middle" >$50k</text><line stroke="#d7e0e8" stroke-width="1" x1="383.5" y1="14" x2="383.5" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="383.5" y="448" text-anchor="middle" >$75k</text><line stroke="#d7e0e8" stroke-width="1" x1="490" y1="14" x2="490" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="490" y="448" text-anchor="middle" >$100k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Purchase down payment applied</text><rect x="64" y="37" width="21.299999999999997" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$5,000</text><line x1="85.3" x2="85.3" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Loan payments within window</text><rect x="85.3" y="104" width="146.26733649928468" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">+$34,335.06</text><line x1="231.56733649928466" x2="231.56733649928466" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Additional buyer running costs</text><rect x="231.56733649928466" y="171" width="10.224000000000018" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">+$2,400</text><line x1="241.79133649928468" x2="241.79133649928468" y1="189" y2="238" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Remaining principal paid at sale</text><rect x="241.79133649928468" y="238" width="35.405630132903184" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">+$8,311.18</text><line x1="277.19696663218787" x2="277.19696663218787" y1="256" y2="305" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="294" text-anchor="start" >Net sale proceeds before debt</text><rect x="183.4769666321879" y="305" width="93.71999999999997" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="339" text-anchor="start" class="plot-value">-$22,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="361" text-anchor="start" >Buy-and-sell net cash cost</text><rect x="64" y="372" width="119.4769666321879" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="406" text-