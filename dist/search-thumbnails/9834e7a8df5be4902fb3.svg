<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 391" width="520" height="391" role="img" aria-labelledby="rrif-kind-cash-budget-title rrif-kind-cash-budget-desc"><title id="rrif-kind-cash-budget-title">Assign the actual bank cash to tax and household bills</title><desc id="rrif-kind-cash-budget-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="357"/><line stroke="#d7e0e8" stroke-width="1" x1="170.5" y1="14" x2="170.5" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="170.5" y="381" text-anchor="middle" >$4.8k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="14" x2="277" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="381" text-anchor="middle" >$11.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="383.5" y1="14" x2="383.5" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="383.5" y="381" text-anchor="middle" >$18.3k</text><line stroke="#d7e0e8" stroke-width="1" x1="490" y1="14" x2="490" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="490" y="381" text-anchor="middle" >$25k</text><line stroke="#d7e0e8" stroke-width="1" x1="95.55555555555556" y1="14" x2="95.55555555555556" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="95.55555555555556" y="381" text-anchor="middle" >$0</text><line stroke="#91aabd" stroke-width="1" x1="95.55555555555556" y1="14" x2="95.55555555555556" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Bank cash before receipt</text><rect x="95.55555555555556" y="37" width="189.33333333333337" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$12,000</text><line x1="284.8888888888889" x2="284.8888888888889" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Cash portion received</text><rect x="284.8888888888889" y="104" width="157.77777777777771" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">+$10,000</text><line x1="442.66666666666663" x2="442.66666666666663" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Tax cash earmark</text><rect x="348" y="171" width="94.66666666666663" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">-$6,000</text><line x1="348" x2="348" y1="189" y2="238" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Planned household bills</text><rect x="64" y="238" width="284" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">-$18,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="294" text-anchor="start" >Spare / unfunded budget capacity</text><rect x="64" y="305" width="31.555555555555557" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="339" text-anchor="start" class="plot-value">-$2,000</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="357" x2="490" y2="357"/></svg>