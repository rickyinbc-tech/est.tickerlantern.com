e">$32,711</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="148" text-anchor="start" >Third income quintile</text><rect x="52" y="160" width="287.145" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="193" text-anchor="start" class="plot-value">$31,905</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="210" text-anchor="start" >Fourth income quintile</text><rect x="52" y="222" width="274.59" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="255" text-anchor="start" class="plot-value">$30,510</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="272" text-anchor="start" >Highest income quintile</text><rect x="52" y="284" width="248.88599999999997" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="317" text-anchor="start" class="plot-value">$27,654</text><line stroke="#91aabd" stroke-width="1" x1="52" y1="29" x2="52" y2="330"/><line stroke="#91aabd" stroke-width="1" x1="52" y1="330" x2="502" y2="330"/></svg>