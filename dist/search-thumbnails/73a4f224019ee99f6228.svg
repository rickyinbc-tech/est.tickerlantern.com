<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="sale-basis-tax-matrix-title sale-basis-tax-matrix-desc"><title id="sale-basis-tax-matrix-title">Gross sale needed if the goal can be fully funded</title><desc id="sale-basis-tax-matrix-desc">Scenario matrix. Darker cells mean larger values. Scale: $0 to $33.4k. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="22" text-anchor="middle" >0% earmark</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="22" text-anchor="middle" >15%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="22" text-anchor="middle" >25%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="22" text-anchor="middle" >40%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >ACB / value 0%</text><rect x="111" y="44" width="98" height="54" fill="rgb(153,201,197)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="76" text-anchor="middle" class="plot-cell-label">$20.1k</text><rect x="211" y="44" width="98" height="54" fill="rgb(137,193,188)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="76" text-anchor="middle" class="plot-cell-label">$23.6k</text><rect x="311" y="44" width="98" height="54" fill="rgb(122,186,180)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="76" text-anchor="middle" class="plot-cell-label">$26.8k</text><rect x="411" y="44" width="98" height="54" fill="rgb(91,170,164)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="76" text-anchor="middle" class="plot-cell-label">$33.4k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >ACB / value 30%</text><rect x="111" y="100" width="98" height="54" fill="rgb(153,201,197)"/><text