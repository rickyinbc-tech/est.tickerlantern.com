<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 458" width="520" height="458" role="img" aria-labelledby="car-equity-closing-bridge-title car-equity-closing-bridge-desc"><title id="car-equity-closing-bridge-title">The old loan is settled inside the replacement transaction</title><desc id="car-equity-closing-bridge-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="448" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="173" y1="14" x2="173" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="173" y="448" text-anchor="middle" >$25k</text><line stroke="#d7e0e8" stroke-width="1" x1="282" y1="14" x2="282" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="282" y="448" text-anchor="middle" >$50k</text><line stroke="#d7e0e8" stroke-width="1" x1="391" y1="14" x2="391" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="391" y="448" text-anchor="middle" >$75k</text><line stroke="#d7e0e8" stroke-width="1" x1="500" y1="14" x2="500" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="500" y="448" text-anchor="middle" >$100k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Replacement vehicle price</text><rect x="64" y="37" width="174.4" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$40,000</text><line x1="238.4" x2="238.4" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Other entered purchase charges</text><rect x="238.4" y="104" width="8.719999999999999" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">+$2,000</text><line x1="247.12" x2="247.12" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Old loan payout required</text><rect x="247.12" y="171" width="122.07999999999998" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">+$28,000</text><line x1="369.2" x2="369.2" y1="189" y2="238" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Trade-in proceeds</text><rect x="273.28" y="238" width="95.92000000000002" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">-$22,000</text><line x1="273.28" x2="273.28" y1="256" y2="305" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="294" text-anchor="start" >Cash actually applied</text><rect x="251.48" y="305" width="21.799999999999983" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="339" text-anchor="start" class="plot-value">-$5,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="361" text-anchor="start" >New loan / cash released</text><rect x="64" y="372" width="187.48" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="406" text-anchor="start" class="plot-value">$43,000</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="424" x2="500" y2="424"/></svg>