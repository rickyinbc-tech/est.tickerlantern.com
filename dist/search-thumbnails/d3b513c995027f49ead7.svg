<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 168" width="520" height="168" role="img" aria-labelledby="deposit-map-headroom-title deposit-map-headroom-desc"><title id="deposit-map-headroom-title">Unused headroom in one cell cannot offset an excess in another</title><desc id="deposit-map-headroom-desc">Scenario matrix. Negative values use gold; positive values use teal. Read the signed cell labels. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="210" y="22" text-anchor="middle" >One-name</text><text font-family="sans-serif" font-size="10" fill="#556779" x="410" y="22" text-anchor="middle" >TFSA</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >Member A</text><rect x="111" y="44" width="198" height="54" fill="rgb(240,238,229)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="210" y="76" text-anchor="middle" class="plot-cell-label">-$10k</text><rect x="311" y="44" width="198" height="54" fill="rgb(240,238,229)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="410" y="76" text-anchor="middle" class="plot-cell-label">-$10k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >Member B</text><rect x="111" y="100" width="198" height="54" fill="rgb(224,238,236)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="210" y="132" text-anchor="middle" class="plot-cell-label">$10k</text><rect x="311" y="100" width="198" height="54" fill="rgb(91,170,164)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="410" y="132" text-anchor="middle" class="plot-cell-label">$70k</text></svg>