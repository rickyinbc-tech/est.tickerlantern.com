<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 592" width="520" height="592" role="img" aria-labelledby="home-cash-ledger-title home-cash-ledger-desc"><title id="home-cash-ledger-title">Count the credited deposit once in the cash ledger</title><desc id="home-cash-ledger-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="582" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="170.5" y1="14" x2="170.5" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="170.5" y="582" text-anchor="middle" >$50k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="14" x2="277" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="582" text-anchor="middle" >$100k</text><line stroke="#d7e0e8" stroke-width="1" x1="383.5" y1="14" x2="383.5" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="383.5" y="582" text-anchor="middle" >$150k</text><line stroke="#d7e0e8" stroke-width="1" x1="490" y1="14" x2="490" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="490" y="582" text-anchor="middle" >$200k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="558"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Modeled down payment</text><rect x="64" y="37" width="149.1" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$70,000</text><line x1="213.1" x2="213.1" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Closing-cost allowance</text><rect x="213.1" y="104" width="44.73000000000005" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">+$21,000</text><line x1="257.83000000000004" x2="257.83000000000004" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Additional fixed closing costs</text><rect x="257.83000000000004" y="171" width="4.259999999999991" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">+$2,000</text><line x1="262.09000000000003" x2="262.09000000000003" y1="189" y2="238" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Moving and setup</text><rect x="262.09000000000003" y="238" width="10.649999999999977" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">+$5,000</text><line x1="272.74" x2="272.74" y1="256" y2="305" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="294" text-anchor="start" >Cash retained after closing</text><rect x="272.74" y="305" width="21.30000000000001" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="339" text-anchor="start" class="plot-value">+$10,000</text><line x1="294.04" x2="294.04" y1="323" y2="372" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="361" text-anchor="start" >Deposit already credited</text><rect x="251.44" y="372" width="42.60000000000002" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="406" text-anchor="start" class="plot-value">-$20,000</text><line x1="251.44" x2="251.44" y1="390" y2="439" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="428" text-anchor="start" >Cash available after deposit</text><rect x="81.03999999999999" y="439" width="170.4" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="473" text-anchor="start" class="plot-value">-$80,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="495" text-anchor="start" >Cash still to arrange / excess</text><rect x="64" y="506" width="17.039999999999992" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="540" text-anchor="start" class="plot-value">$8,000</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="558" x2="490" y2="558"/></svg>