<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 238" width="520" height="238" role="img" aria-labelledby="household-scale-measures-title household-scale-measures-desc"><title id="household-scale-measures-title">The same annual income produces three different measures</title><desc id="household-scale-measures-desc">Horizontal bar chart. CAD; value axis starts at zero. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="52" y1="29" x2="52" y2="206"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="228" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="164.5" y1="29" x2="164.5" y2="206"/><text font-family="sans-serif" font-size="10" fill="#556779" x="164.5" y="228" text-anchor="middle" >$25k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="29" x2="277" y2="206"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="228" text-anchor="middle" >$50k</text><line stroke="#d7e0e8" stroke-width="1" x1="389.5" y1="29" x2="389.5" y2="206"/><text font-family="sans-serif" font-size="10" fill="#556779" x="389.5" y="228" text-anchor="middle" >$75k</text><line stroke="#d7e0e8" stroke-width="1" x1="502" y1="29" x2="502" y2="206"/><text font-family="sans-serif" font-size="10" fill="#556779" x="502" y="228" text-anchor="middle" >$100k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="24" text-anchor="start" >Unadjusted household income</text><rect x="52" y="36" width="324" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="69" text-anchor="start" class="plot-value">$72,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="86" text-anchor="start" >Income ÷ square root of people</text><rect x="52" y="98" width="162" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="131" text-anchor="start" class="plot-value">$36,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="148" text-anchor="start" >Income ÷ number of people</text><rect x="52" y="160" width="81" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="193" text-anchor="start" class="plot-value">$18,000</text><line stroke="#91aabd" stroke-width="1" x1="52" y1="29" x2="52" y2="206"/><line stroke="#91aabd" stroke-width="1" x1="52" y1="206" x2="502" y2="206"/></svg>