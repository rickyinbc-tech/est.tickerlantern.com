<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="price-cut-discount-volume-matrix-title price-cut-discount-volume-matrix-desc"><title id="price-cut-discount-volume-matrix-title">Test price reductions beside unit volumes instead of assuming revenue growth preserves surplus</title><desc id="price-cut-discount-volume-matrix-desc">Scenario matrix. Negative values use gold; positive values use teal. Read the signed cell labels. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="22" text-anchor="middle" >0% cut</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="22" text-anchor="middle" >10% cut</text><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="22" text-anchor="middle" >20% cut</text><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="22" text-anchor="middle" >30% cut</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >100 units</text><rect x="111" y="44" width="98" height="54" fill="rgb(246,249,248)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="76" text-anchor="middle" class="plot-cell-label">$0</text><rect x="211" y="44" width="98" height="54" fill="rgb(239,236,226)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="76" text-anchor="middle" class="plot-cell-label">-$1,000</text><rect x="311" y="44" width="98" height="54" fill="rgb(233,223,204)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="76" text-anchor="middle" class="plot-cell-label">-$2,000</text><rect x="411" y="44" width="98" height="54" fill="rgb(226,210,182)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="76" text-anchor="middle" class="plot-cell-label">-$3,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="13