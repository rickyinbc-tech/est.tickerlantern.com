<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 324" width="520" height="324" role="img" aria-labelledby="deposit-access-interest-difference-title deposit-access-interest-difference-desc"><title id="deposit-access-interest-difference-title">Explain the ending difference through interest earned and paid</title><desc id="deposit-access-interest-difference-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="314" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="170.5" y1="14" x2="170.5" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="170.5" y="314" text-anchor="middle" >$250</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="14" x2="277" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="314" text-anchor="middle" >$500</text><line stroke="#d7e0e8" stroke-width="1" x1="383.5" y1="14" x2="383.5" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="383.5" y="314" text-anchor="middle" >$750</text><line stroke="#d7e0e8" stroke-width="1" x1="490" y1="14" x2="490" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="490" y="314" text-anchor="middle" >$1k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Locked deposit interest</text><rect x="64" y="37" width="383.40000000000003" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$900</text><line x1="447.40000000000003" x2="447.40000000000003