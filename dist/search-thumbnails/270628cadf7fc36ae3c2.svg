<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 659" width="520" height="659" role="img" aria-labelledby="mortgage-budget-cash-title mortgage-budget-cash-desc"><title id="mortgage-budget-cash-title">The take-home budget pays the full cash bills</title><desc id="mortgage-budget-cash-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="625"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="649" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="173" y1="14" x2="173" y2="625"/><text font-family="sans-serif" font-size="10" fill="#556779" x="173" y="649" text-anchor="middle" >$2.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="282" y1="14" x2="282" y2="625"/><text font-family="sans-serif" font-size="10" fill="#556779" x="282" y="649" text-anchor="middle" >$5k</text><line stroke="#d7e0e8" stroke-width="1" x1="391" y1="14" x2="391" y2="625"/><text font-family="sans-serif" font-size="10" fill="#556779" x="391" y="649" text-anchor="middle" >$7.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="500" y1="14" x2="500" y2="625"/><text font-family="sans-serif" font-size="10" fill="#556779" x="500" y="649" text-anchor="middle" >$10k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="625"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Monthly take-home income</text><rect x="64" y="37" width="327" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$7,500</text><line x1="391" x2="391" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Actual mortgage P&amp;I</text><rect x="282" y="104" width="109" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">-$2,500</text><line x1="282" x2="282" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Property tax and heating</text><rect x="262.38" y="171" width="19.620000000000005" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">-$450</text><line x1="262.38" x2="262.38" y1="189" y2="238" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Full condo fees</text><rect x="244.94" y="238" width="17.439999999999998" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">-$400</text><line x1="244.94" x2="244.94" y1="256" y2="305" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="294" text-anchor="start" >Other non-overlapping home costs</text><rect x="229.68" y="305" width="15.259999999999991" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="339" text-anchor="start" class="plot-value">-$350</text><line x1="229.68" x2="229.68" y1="323" y2="372" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="361" text-anchor="start" >Actual other debt repayments</text><rect x="207.88" y="372" width="21.80000000000001" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="406" text-anchor="start" class="plot-value">-$500</text><line x1="207.88" x2="207.88" y1="390" y2="439" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="428" text-anchor="start" >Non-housing living costs</text><rect x="98.88" y="439" width="109" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="473" text-anchor="start" class="plot-value">-$2,500</text><line x1="98.88" x2="98.88" y1="457" y2="506" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="495" text-anchor="start" >Planned saving</text><rect x="66.18" y="506" width="32.69999999999999" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="540" text-anchor="start" class="plot-value">-$750</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="562" text-anchor="start" >Monthly cash remaining</text><rect x="64" y="573" width="2.180000000000007" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="607" text-anchor="start" class="plot-value">$50</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="625" x2="500" y2="625"/></svg>