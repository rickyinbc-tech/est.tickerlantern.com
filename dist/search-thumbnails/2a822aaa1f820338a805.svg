<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 458" width="520" height="458" role="img" aria-labelledby="fee-slices-progressive-bridge-title fee-slices-progressive-bridge-desc"><title id="fee-slices-progressive-bridge-title">Build the progressive annual quote one asset slice at a time</title><desc id="fee-slices-progressive-bridge-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="448" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="170.5" y1="14" x2="170.5" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="170.5" y="448" text-anchor="middle" >$500</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="14" x2="277" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="448" text-anchor="middle" >$1k</text><line stroke="#d7e0e8" stroke-width="1" x1="383.5" y1="14" x2="383.5" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="383.5" y="448" text-anchor="middle" >$1.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="490" y1="14" x2="490" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="490" y="448" text-anchor="middle" >$2k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >First CAD 100,000 slice</text><rect x="64" y="37" width="170.4" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$800</text><line x1="234.4" x2="234.4" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Next CAD 400,000 slice</text><rect x="234.4" y="104" width="159.75000000000003" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">+$750</text><line x1="394.15000000000003" x2="394.15000000000003" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Above CAD 500,000 slice</text><rect x="394.15000000000003" y="171" width="0" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">$0</text><line x1="394.15000000000003" x2="394.15000000000003" y1="189" y2="238" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Minimum asset-charge uplift</text><rect x="394.15000000000003" y="238" width="0" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">$0</text><line x1="394.15000000000003" x2="394.15000000000003" y1="256" y2="305" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="294" text-anchor="start" >Fixed annual account fee</text><rect x="394.15000000000003" y="305" width="25.559999999999945" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="339" text-anchor="start" class="plot-value">+$120</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="361" text-anchor="start" >Total progressive annual charge</text><rect x="64" y="372" width="355.71" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="406" text-anchor="start" class="plot-value">$1,670</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="424" x2="490" y2="424"/></svg>