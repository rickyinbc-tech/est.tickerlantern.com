<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 324" width="520" height="324" role="img" aria-labelledby="rrsp-immediate-cash-title rrsp-immediate-cash-desc"><title id="rrsp-immediate-cash-title">Reconcile the withdrawal to cash available immediately</title><desc id="rrsp-immediate-cash-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="314" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="173" y1="14" x2="173" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="173" y="314" text-anchor="middle" >$2.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="282" y1="14" x2="282" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="282" y="314" text-anchor="middle" >$5k</text><line stroke="#d7e0e8" stroke-width="1" x1="391" y1="14" x2="391" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="391" y="314" text-anchor="middle" >$7.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="500" y1="14" x2="500" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="500" y="314" text-anchor="middle" >$10k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="290"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Gross RRSP withdrawal</text><rect x="64" y="37" width="436" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$10,000</text><line x1="500" x2="500" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Tax withheld by institution</text><rect x="412.8" y="104" width="87.19999999999999" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">-$2,000</text><line x1="412.8" x2="412.8" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Separate transaction fee</text><rect x="410.62" y="171" width="2.180000000000007" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">-$50</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Net transaction cash</text><rect x="64" y="238" width="346.62" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">$7,950</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="290" x2="500" y2="290"/></svg>