<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="tail-measures-confidence-severity-title tail-measures-confidence-severity-desc"><title id="tail-measures-confidence-severity-title">Tail averages change when the chosen probability tail or loss sizes change</title><desc id="tail-measures-confidence-severity-desc">Scenario matrix. Darker cells mean larger values. Scale: $0 to $60k. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="22" text-anchor="middle" >50%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="22" text-anchor="middle" >100%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="22" text-anchor="middle" >125%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="22" text-anchor="middle" >150%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >80% level</text><rect x="111" y="44" width="98" height="54" fill="rgb(233,243,241)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="76" text-anchor="middle" class="plot-cell-label">$4.9k</text><rect x="211" y="44" width="98" height="54" fill="rgb(221,236,234)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="76" text-anchor="middle" class="plot-cell-label">$9.8k</text><rect x="311" y="44" width="98" height="54" fill="rgb(215,233,231)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="76" text-anchor="middle" class="plot-cell-label">$12.2k</text><rect x="411" y="44" width="98" height="54" fill="rgb(208,230,227)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="76" text-anchor="middle" class="plot-cell-label">$14.6k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >90% level</text><rect x="111" y="100" width="98" height="54" fill="rgb(227,239,238)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="132" text-anchor="middle" class="plot-cell-label">$7.3k</text><rect x="211" y="100" width="98" height="54" fill="rgb(209,230,228)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="132" text-anchor="middle" class="plot-cell-label">$14.5k</text><rect x="311" y="100" width="98" height="54" fill="rgb(199,225,222)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="132" text-anchor="middle" class="plot-cell-label">$18.1k</text><rect x="411" y="100" width="98" height="54" fill="rgb(190,220,217)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="132" text-anchor="middle" class="plot-cell-label">$21.8k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="188" text-anchor="end" >95% level</text><rect x="111" y="156" width="98" height="54" fill="rgb(215,233,231)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="188" text-anchor="middle" class="plot-cell-label">$12k</text><rect x="211" y="156" width="98" height="54" fill="rgb(184,217,214)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="188" text-anchor="middle" class="plot-cell-label">$24k</text><rect x="311" y="156" width="98" height="54" fill="rgb(169,209,206)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="188" text-anchor="middle" class="plot-cell-label">$30k</text><rect x="411" y="156" width="98" height="54" fill="rgb(153,201,197)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="188" text-anchor="middle" class="plot-cell-label">$36k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="244" text-anchor="end" >99% level</text><rect x="111" y="212" width="98" height="54" fill="rgb(194,223,220)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="244" text-anchor="middl