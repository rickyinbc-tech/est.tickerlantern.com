<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 458" width="520" height="458" role="img" aria-labelledby="pay-calendar-reconciliation-title pay-calendar-reconciliation-desc"><title id="pay-calendar-reconciliation-title">Moving the saving date does not create extra annual income</title><desc id="pay-calendar-reconciliation-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="448" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="173" y1="14" x2="173" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="173" y="448" text-anchor="middle" >$25k</text><line stroke="#d7e0e8" stroke-width="1" x1="282" y1="14" x2="282" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="282" y="448" text-anchor="middle" >$50k</text><line stroke="#d7e0e8" stroke-width="1" x1="391" y1="14" x2="391" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="391" y="448" text-anchor="middle" >$75k</text><line stroke="#d7e0e8" stroke-width="1" x1="500" y1="14" x2="500" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="500" y="448" text-anchor="middle" >$100k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Opening operating-account cash</text><rect x="64" y="37" width="8.719999999999999" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$2,000</text><line x1="72.72" x2="72.72" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >26 net paycheques received</text><rect x="72.72" y="104" width="260.72799999999995" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">+$59,800</text><line x1="333.448" x2="333.448" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Twelve fixed-bill payments</text><rect x="186.952" y="171" width="146.49599999999998" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">-$33,600</text><line x1="186.952" x2="186.952" y1="189" y2="238" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Other spending over 365 days</text><rect x="108.472" y="238" width="78.48" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">-$18,000</text><line x1="108.472" x2="108.472" y1="256" y2="305" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="294" text-anchor="start" >Twelve transfers to separate savings</text><rect x="82.312" y="305" width="26.159999999999997" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="339" text-anchor="start" class="plot-value">-$6,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="361" text-anchor="start" >December 31 operating cash</text><rect x="64" y="372" width="18.311999999999998" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="406" text-anchor="start" class="plot-value">$4,200</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="424" x2="500" y2="424"/></svg>