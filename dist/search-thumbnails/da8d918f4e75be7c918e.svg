<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 257" width="520" height="257" role="img" aria-labelledby="variable-mortgage-principal-bridge-title variable-mortgage-principal-bridge-desc"><title id="variable-mortgage-principal-bridge-title">First month after the change: payment minus interest</title><desc id="variable-mortgage-principal-bridge-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="247" text-anchor="middle" >-$250</text><line stroke="#d7e0e8" stroke-width="1" x1="170.5" y1="14" x2="170.5" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="170.5" y="247" text-anchor="middle" >$437.5</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="14" x2="277" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="247" text-anchor="middle" >$1.1k</text><line stroke="#d7e0e8" stroke-width="1" x1="383.5" y1="14" x2="383.5" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="383.5" y="247" text-anchor="middle" >$1.8k</text><line stroke="#d7e0e8" stroke-width="1" x1="490" y1="14" x2="490" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="490" y="247" text-anchor="middle" >$2.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="102.72727272727272" y1="14" x2="102.72727272727272" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="102.72727272727272" y="247" text-anchor="middle" >$0</text><line stroke="#91aabd" stroke-width="1" x1="102.72727272727272" y1="14" x2="102.72727272727272" y2="223"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Cash payment in the fixed-payment path</text><rect x="102.72727272727272" y="37" width="371.78181818181815" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$2,400</text><line x1="474.5090909090909" x2="474.5090909090909" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Less interest charged for that month</text><rect x="70.71736837716557" y="104" width="403.7917225319253" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">-$2,606.64</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Principal reduction, or debt added if negative</text><rect x="70.71736837716557" y="171" width="32.00990435010715" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">-$206.64</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="223" x2="490" y2="223"/></svg>