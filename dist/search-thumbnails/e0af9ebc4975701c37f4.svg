<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 298" width="520" height="298" role="img" aria-labelledby="cesg-contribution-rule-title cesg-contribution-rule-desc"><title id="cesg-contribution-rule-title">A larger contribution needs unused room to produce catch-up grants</title><desc id="cesg-contribution-rule-desc">Horizontal grouped bar chart. CAD; value axis starts at zero. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="52" y1="29" x2="52" y2="266"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="288" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="164.5" y1="29" x2="164.5" y2="266"/><text font-family="sans-serif" font-size="10" fill="#556779" x="164.5" y="288" text-anchor="middle" >$250</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="29" x2="277" y2="266"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="288" text-anchor="middle" >$500</text><line stroke="#d7e0e8" stroke-width="1" x1="389.5" y1="29" x2="389.5" y2="266"/><text font-family="sans-serif" font-size="10" fill="#556779" x="389.5" y="288" text-anchor="middle" >$750</text><line stroke="#d7e0e8" stroke-width="1" x1="502" y1="29" x2="502" y2="266"/><text font-family="sans-serif" font-size="10" fill="#556779" x="502" y="288" text-anchor="middle" >$1k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="24" text-anchor="start" >CAD 1,000 contribution</text><rect x="52" y="34" width="90" height="13" fill="#087f76"/><rect x="52" y="54" width="90" height="13" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="89" text-anchor="start" class="plot-value">$200 / $200</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="106" text-anchor="start" >CAD 2,500 contribution</text><rect x="52" y="116" width="225" height="13" fill="#087f76"/><rect x="52" y="136" width="225" height="13" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="171" text-anchor="start" class="plot-value">$500 / $500</text><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="188" text-anchor="start" >CAD 5,000 contribution</text><rect x="52" y="198" width="225" height="13" fill="#087f76"/><rect x="52" y="218" width="450" height="13" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="52" y="253" text-anchor="start" class="plot-value">$500 / $1,000</text><line stroke="#91aabd" stroke-width="1" x1="52" y1="29" x2="52" y2="266"/><line stroke="#91aabd" stroke-width="1" x1="52" y1="266" x2="502" y2="266"/></svg>