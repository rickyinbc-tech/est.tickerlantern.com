<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 391" width="520" height="391" role="img" aria-labelledby="gic-cash-reconciliation-title gic-cash-reconciliation-desc"><title id="gic-cash-reconciliation-title">Maturity proceeds include the capital already committed</title><desc id="gic-cash-reconciliation-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="381" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="173" y1="14" x2="173" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="173" y="381" text-anchor="middle" >$25k</text><line stroke="#d7e0e8" stroke-width="1" x1="282" y1="14" x2="282" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="282" y="381" text-anchor="middle" >$50k</text><line stroke="#d7e0e8" stroke-width="1" x1="391" y1="14" x2="391" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="391" y="381" text-anchor="middle" >$75k</text><line stroke="#d7e0e8" stroke-width="1" x1="500" y1="14" x2="500" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="500" y="381" text-anchor="middle" >$100k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Separate starting cash reserve</text><rect x="64" y="37" width="21.799999999999997" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$5,000</text><line x1="85.8" x2="85.8" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Original principal returned</text><rect x="85.8" y="104" width="218" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">+$50,000</text><line x1="303.8" x2="303.8" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Total ladder interest received</text><rect x="303.8" y="171" width="27.597730160640026" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">+$6,329.75</text><line x1="331.39773016064004" x2="331.39773016064004" y1="189" y2="238" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Five annual cash needs</text><rect x="69.79773016064004" y="238" width="261.6" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">-$60,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="294" text-anchor="start" >Cash after the fifth annual bill</text><rect x="64" y="305" width="5.797730160640043" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="339" text-anchor="start" class="plot-value">$1,329.75</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="357" x2="500" y2="357"/></svg>