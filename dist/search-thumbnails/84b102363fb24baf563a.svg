="#556779" x="64" y="406" text-anchor="start" class="plot-value">$0</text><line x1="227.15800000000002" x2="227.15800000000002" y1="390" y2="439" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="428" text-anchor="start" >Less the 86% that is not credited</text><rect x="86.84212" y="439" width="140.31588000000002" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="473" text-anchor="start" class="plot-value">-$6,587.6</text><line x1="86.84212" x2="86.84212" y1="457" y2="506" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="495" text-anchor="start" >Less credit with no tax to absorb it</text><rect x="86.84212" y="506" width="0" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="540" text-anchor="start" class="plot-value">$0</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="562" text-anchor="start" >Claimant’s federal credit</text><rect x="64" y="573" width="22.842119999999994" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="607" text-anchor="start" class="plot-value">$1,072.4</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="625" x2="490" y2="625"/></svg>