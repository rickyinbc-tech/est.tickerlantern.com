<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="deferred-rate-wait-matrix-title deferred-rate-wait-matrix-desc"><title id="deferred-rate-wait-matrix-title">A longer wait can reverse the result at the same future amount</title><desc id="deferred-rate-wait-matrix-desc">Scenario matrix. Negative values use gold; positive values use teal. Read the signed cell labels. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="22" text-anchor="middle" >0% rate</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="22" text-anchor="middle" >3%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="22" text-anchor="middle" >6%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="22" text-anchor="middle" >9%</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >1 yr wait</text><rect x="111" y="44" width="98" height="54" fill="rgb(183,217,214)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="76" text-anchor="middle" class="plot-cell-label">$4k</text><rect x="211" y="44" width="98" height="54" fill="rgb(194,222,220)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="76" text-anchor="middle" class="plot-cell-label">$3.3k</text><rect x="311" y="44" width="98" height="54" fill="rgb(205,228,225)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="76" text-anchor="middle" class="plot-cell-label">$2.6k</text><rect x="411" y="44" width="98" height="54" fill="rgb(214,233,231)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="76" text-anchor="middle" class="plot-cell-label">$2k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >3 yr wait</text><rect x="111" y="100" width="98" height="54" fill="rgb(183,217,214)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="132" text-anchor="middle" class="plot-cell-label">$4k</text><rect x="211" y="100" width="98" height="54" fill="rgb(215,233,231)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="132" text-anchor="middle" class="plot-cell-label">$2k</text><rect x="311" y="100" width="98" height="54" fill="rgb(244,248,247)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="132" text-anchor="middle" class="plot-cell-label">$150.9</text><rect x="411" y="100" width="98" height="54" fill="rgb(240,237,228)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="132" text-anchor="middle" class="plot-cell-label">-$1.5k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="188" text-anchor="end" >5 yr wait</text><rect x="111" y="156" width="98" height="54" fill="rgb(183,217,214)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="188" text-anchor="middle" class="plot-cell-label">$4k</text><rect x="211" y="156" width="98" height="54" fill="rgb(235,243,242)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="188" text-anchor="middle" class="plot-cell-label">$702.6</text><rect x="311" y="156" width="98" height="54" fill="rgb(238,233,220)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="188" text-anchor="middle" class="plot-cell-label">-$2.1k</text><rect x="411" y="156" width="98" height="54" fill="rgb(228,214,189)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="188" text-anchor="middle" class="plot-cell-label">-$4.4k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="244" text-anchor="end" >10 yr wait</text><rect x="111" y="212" width="98" height="54" fill="rgb(183,217,214)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="244" text-anchor="middle" class="plot-cell-label">$4k</text><rect x="211" y="212" width="98" height="54" fill="rgb(237,232,219)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="244" text-anchor="middle" class="plot-cell-label">-$2.1k</text><rect x="311" y="212" width="98" height="54" fill="rgb(219,197,160)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="244" text-anchor="middle" class="plot-cell-label">-$6.6k</text><rect x="411" y="212" width="98" height="54" fill="rgb(206,172,117)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="244" text-anchor="middle" class="plot-cell-label">-$9.9k</text></svg>