<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 264" width="520" height="264" role="img" aria-labelledby="replacement-ratio-net-comparison-title replacement-ratio-net-comparison-desc"><title id="replacement-ratio-net-comparison-title">Pass the chosen gross ratio through its tax assumption before comparing it with bills</title><desc id="replacement-ratio-net-comparison-desc">Horizontal signed bars around an explicit zero axis. Negative values extend left of zero, and positive values extend right. Signs and exact values are included in labels and the data table. Exact values are available in the chart data table below.</desc><line stroke="#91aabd" stroke-width="1" x1="64" y1="30" x2="64" y2="232"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="254" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="170.5" y1="30" x2="170.5" y2="232"/><text font-family="sans-serif" font-size="10" fill="#556779" x="170.5" y="254" text-anchor="middle" >$25k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="30" x2="277" y2="232"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="254" text-anchor="middle" >$50k</text><line stroke="#d7e0e8" stroke-width="1" x1="383.5" y1="30" x2="383.5" y2="232"/><text font-family="sans-serif" font-size="10" fill="#556779" x="383.5" y="254" text-anchor="middle" >$75k</text><line stroke="#d7e0e8" stroke-width="1" x1="490" y1="30" x2="490" y2="232"/><text font-family="sans-serif" font-size="10" fill="#556779" x="490" y="254" text-anchor="middle" >$100k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="24" text-anchor="start" >Net cash from chosen ratio</text><rect x="64" y="36" width="238.56000000000006" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="69" text-anchor="start" class="plot-value">$56,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="94" text-anchor="st