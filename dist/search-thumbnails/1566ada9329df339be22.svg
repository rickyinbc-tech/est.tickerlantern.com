<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 458" width="520" height="458" role="img" aria-labelledby="work-monthly-cash-title work-monthly-cash-desc"><title id="work-monthly-cash-title">Additional take-home pay is only the first budget line</title><desc id="work-monthly-cash-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="448" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="173" y1="14" x2="173" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="173" y="448" text-anchor="middle" >$1.3k</text><line stroke="#d7e0e8" stroke-width="1" x1="282" y1="14" x2="282" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="282" y="448" text-anchor="middle" >$2.5k</text><line stroke="#d7e0e8" stroke-width="1" x1="391" y1="14" x2="391" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="391" y="448" text-anchor="middle" >$3.8k</text><line stroke="#d7e0e8" stroke-width="1" x1="500" y1="14" x2="500" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="500" y="448" text-anchor="middle" >$5k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="424"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Additional take-home work pay</text><rect x="64" y="37" width="305.2" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$3,500</text><line x1="369.2" x2="369.2" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >Additional household child care</text><rect x="299.44000000000005" y="104" width="69.75999999999993" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">-$800</text><line x1="299.44000000000005" x2="299.44000000000005" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Additional commuting</text><rect x="282" y="171" width="17.440000000000055" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">-$200</text><line x1="282" x2="282" y1="189" y2="238" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >Other additional work costs</text><rect x="268.91999999999996" y="238" width="13.080000000000041" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">-$150</text><line x1="268.91999999999996" x2="268.91999999999996" y1="256" y2="305" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="294" text-anchor="start" >Other net household income lost</text><rect x="225.32" y="305" width="43.599999999999966" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="339" text-anchor="start" class="plot-value">-$500</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="361" text-anchor="start" >Monthly household cash change</text><rect x="64" y="372" width="161.32" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="406" text-anchor="start" class="plot-value">$1,850</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="424" x2="500" y2="424"/></svg>