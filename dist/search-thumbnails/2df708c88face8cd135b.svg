<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 391" width="520" height="391" role="img" aria-labelledby="payday-annual-bridge-title payday-annual-bridge-desc"><title id="payday-annual-bridge-title">Reconcile the year-end cash position</title><desc id="payday-annual-bridge-desc">Horizontal waterfall. Teal steps add to the running amount, gold steps subtract, and the navy endpoint is the total. Negative endpoints extend left of zero on the value scale. Exact values are available in the chart data table below.</desc><line stroke="#d7e0e8" stroke-width="1" x1="64" y1="14" x2="64" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="381" text-anchor="middle" >$0</text><line stroke="#d7e0e8" stroke-width="1" x1="170.5" y1="14" x2="170.5" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="170.5" y="381" text-anchor="middle" >$25k</text><line stroke="#d7e0e8" stroke-width="1" x1="277" y1="14" x2="277" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="277" y="381" text-anchor="middle" >$50k</text><line stroke="#d7e0e8" stroke-width="1" x1="383.5" y1="14" x2="383.5" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="383.5" y="381" text-anchor="middle" >$75k</text><line stroke="#d7e0e8" stroke-width="1" x1="490" y1="14" x2="490" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="490" y="381" text-anchor="middle" >$100k</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="14" x2="64" y2="357"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="26" text-anchor="start" >Starting accessible cash</text><rect x="64" y="37" width="2.1299999999999955" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="71" text-anchor="start" class="plot-value">+$500</text><line x1="66.13" x2="66.13" y1="55" y2="104" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="93" text-anchor="start" >26 net salary receipts</text><rect x="66.13" y="104" width="221.51999999999998" height="18" fill="#087f76"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="138" text-anchor="start" class="plot-value">+$52,000</text><line x1="287.65" x2="287.65" y1="122" y2="171" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="160" text-anchor="start" >Twelve fixed-bill payments</text><rect x="195.634" y="171" width="92.01599999999999" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="205" text-anchor="start" class="plot-value">-$21,600</text><line x1="195.634" x2="195.634" y1="189" y2="238" stroke="#7f939e" stroke-dasharray="2 3"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="227" text-anchor="start" >365 days of other spending</text><rect x="102.34" y="238" width="93.29399999999998" height="18" fill="#b8822e"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="272" text-anchor="start" class="plot-value">-$21,900</text><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="294" text-anchor="start" >Cash remaining, or unfunded endpoint</text><rect x="64" y="305" width="38.34" height="18" fill="#102f50"/><text font-family="sans-serif" font-size="10" fill="#556779" x="64" y="339" text-anchor="start" class="plot-value">$9,000</text><line stroke="#91aabd" stroke-width="1" x1="64" y1="357" x2="490" y2="357"/></svg>