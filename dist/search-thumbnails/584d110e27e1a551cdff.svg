<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="percentage-deductible-basis-rate-matrix-title percentage-deductible-basis-rate-matrix-desc"><title id="percentage-deductible-basis-rate-matrix-title">A fixed percentage can require more reserve when the declared basis rises</title><desc id="percentage-deductible-basis-rate-matrix-desc">Scenario matrix. Darker cells mean larger values. Scale: $0 to $32k. Exact values are available in the chart data table below.</desc><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="22" text-anchor="middle" >$400k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="22" text-anchor="middle" >$600k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="22" text-anchor="middle" >$800k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="22" text-anchor="middle" >$1000k</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="76" text-anchor="end" >1% of basis</text><rect x="111" y="44" width="98" height="54" fill="rgb(246,249,248)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="76" text-anchor="middle" class="plot-cell-label">$0</text><rect x="211" y="44" width="98" height="54" fill="rgb(246,249,248)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="76" text-anchor="middle" class="plot-cell-label">$0</text><rect x="311" y="44" width="98" height="54" fill="rgb(246,249,248)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="76" text-anchor="middle" class="plot-cell-label">$0</text><rect x="411" y="44" width="98" height="54" fill="rgb(236,244,243)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="76" text-anchor="middle" class="plot-cell-label">$2,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="132" text-anchor="end" >2% of basis</text><rect x="111" y="100" width="98" height="54" fill="rgb(246,249,248)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="132" text-anchor="middle" class="plot-cell-label">$0</text><rect x="211" y="100" width="98" height="54" fill="rgb(227,239,237)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="132" text-anchor="middle" class="plot-cell-label">$4,000</text><rect x="311" y="100" width="98" height="54" fill="rgb(207,229,227)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="132" text-anchor="middle" class="plot-cell-label">$8,000</text><rect x="411" y="100" width="98" height="54" fill="rgb(188,219,216)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="132" text-anchor="middle" class="plot-cell-label">$12,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="188" text-anchor="end" >5% of basis</text><rect x="111" y="156" width="98" height="54" fill="rgb(188,219,216)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="160" y="188" text-anchor="middle" class="plot-cell-label">$12,000</text><rect x="211" y="156" width="98" height="54" fill="rgb(140,194,190)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="260" y="188" text-anchor="middle" class="plot-cell-label">$22,000</text><rect x="311" y="156" width="98" height="54" fill="rgb(91,170,164)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="360" y="188" text-anchor="middle" class="plot-cell-label">$32,000</text><rect x="411" y="156" width="98" height="54" fill="rgb(91,170,164)"/><text font-family="sans-serif" font-size="10" fill="#556779" x="460" y="188" text-anchor="middle" class="plot-cell-label">$32,000</text><text font-family="sans-serif" font-size="10" fill="#556779" x="102" y="244" text-anchor="end" >10% of basis</text><rect x="111" y="212" width="98" height="54" fill="rgb(91,170,164)"/><text font-family="sans-serif" font-size="10" fill="#556779"